<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>道法历史 · 闯关</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #FBF9F5;
            color: #2C2C2C;
            min-height: 100vh;
            padding: 20px 16px 80px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
        }
        /* 顶部切换栏 */
        .tab-bar {
            display: flex;
            gap: 0;
            background: #F0EDE8;
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 28px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 36px;
            background: transparent;
            font-size: 17px;
            font-weight: 500;
            color: #8A8A8A;
            cursor: pointer;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: #FFFFFF;
            color: #2C2C2C;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        /* 进度地图 */
        .map-section {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 24px 20px 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }
        .map-title {
            font-size: 15px;
            font-weight: 500;
            color: #6B6B6B;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
        }
        .map-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 0 4px;
        }
        .map-row::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 24px;
            right: 24px;
            height: 2px;
            background: #E8E4DE;
            z-index: 0;
        }
        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            cursor: pointer;
            gap: 6px;
        }
        .node-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #D6D2CA;
            background: #FBF9F5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #B0B0B0;
            transition: all 0.3s;
        }
        .node.done .node-circle {
            border-color: #5B7B8A;
            background: #5B7B8A;
            color: #fff;
        }
        .node.current .node-circle {
            border-color: #5B7B8A;
            border-width: 2px;
            background: #FFFFFF;
            color: #5B7B8A;
        }
        .node-label {
            font-size: 12px;
            color: #8A8A8A;
            font-weight: 450;
            letter-spacing: 0.2px;
        }
        .node.done .node-label { color: #5B7B8A; font-weight: 500; }
        .node.current .node-label { color: #2C2C2C; font-weight: 500; }
        /* 统计卡片 */
        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #F8F6F3;
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 24px;
            font-weight: 600;
            color: #2C2C2C;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 12px;
            color: #8A8A8A;
            margin-top: 2px;
        }
        /* 入口按钮 */
        .action-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .action-btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            background: #FFFFFF;
            color: #2C2C2C;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn.primary {
            background: #2C2C2C;
            color: #FFFFFF;
        }
        .action-btn.primary:active { opacity: 0.8; }
        .action-btn:active { transform: scale(0.97); }
        /* 底部 */
        .footer {
            font-size: 13px;
            color: #B8B8B8;
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid #F0EDE8;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- 切换栏 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-subject="history">历史</button>
        <button class="tab-btn" data-subject="daofa">道法</button>
    </div>

    <!-- 进度地图 -->
    <div class="map-section">
        <div class="map-title">学习进度 · 八年级</div>
        <div class="map-row" id="mapRow">
            <div class="node done" data-module="七上">
                <div class="node-circle">✓</div>
                <span class="node-label">七上</span>
            </div>
            <div class="node done" data-module="七下">
                <div class="node-circle">✓</div>
                <span class="node-label">七下</span>
            </div>
            <div class="node current" data-module="八上">
                <div class="node-circle">3</div>
                <span class="node-label">八上</span>
            </div>
            <div class="node" data-module="八下">
                <div class="node-circle">4</div>
                <span class="node-label">八下</span>
            </div>
        </div>
    </div>

    <!-- 统计 -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-number">43</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">72%</div>
            <div class="stat-label">正确率</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">200</div>
            <div class="stat-label">总题数</div>
        </div>
    </div>

    <!-- 入口 -->
    <div class="action-grid">
        <button class="action-btn primary" id="continueBtn">继续学习</button>
        <button class="action-btn" id="wrongBtn">错题本</button>
        <button class="action-btn" id="reportBtn">诊断报告</button>
    </div>

    <div class="footer">道法历史 · 闯关诊断</div>
</div>

<script>
    // 切换历史/道法
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            // 这里可以切换题库数据
            console.log('切换到：', this.dataset.subject);
        });
    });

    // 点击节点跳转
    document.querySelectorAll('.node').forEach(node => {
        node.addEventListener('click', function() {
            alert('进入：' + this.dataset.module);
        });
    });

    // 继续学习
    document.getElementById('continueBtn').addEventListener('click', function() {
        alert('继续学习（跳转到上次进度）');
    });

    // 错题本
    document.getElementById('wrongBtn').addEventListener('click', function() {
        alert('打开错题本');
    });

    // 诊断报告
    document.getElementById('reportBtn').addEventListener('click', function() {
        alert('查看诊断报告');
    });
</script>
</body>
</html>
