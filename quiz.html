<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刷题 · 道法历史</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ede8e0;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 780px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 20px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0ede8;
            flex-shrink: 0;
        }
        .header .back {
            font-size: 28px;
            font-weight: 700;
            color: #4a6a8a;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 0.8;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            padding: 0 4px 0 0;
        }
        .header .back:active {
            opacity: 0.6;
        }
        .header .progress {
            font-size: 14px;
            color: #8a7a6a;
            font-weight: 400;
        }
        .header .progress span {
            color: #2c241c;
            font-weight: 500;
        }

        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 18px 0 12px;
            overflow-y: auto;
        }
        .question-area .meta {
            font-size: 12px;
            color: #b8a48a;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .question-area .q {
            font-size: 20px;
            font-weight: 500;
            color: #2c241c;
            line-height: 1.7;
            margin-bottom: 20px;
        }
        .question-area .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }
        .question-area .options .opt {
            padding: 16px 18px;
            border-radius: 16px;
            border: 1.5px solid #f0ede8;
            background: #faf8f6;
            font-size: 16px;
            color: #2c241c;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }
        .question-area .options .opt:active {
            transform: scale(0.97);
        }
        .question-area .options .opt.correct {
            border-color: #5a8a5a;
            background: #eef5ed;
            transform: scale(1.01);
        }
        .question-area .options .opt.wrong {
            border-color: #c45a4a;
            background: #f5eeed;
            transform: scale(1.01);
        }
        .question-area .options .opt.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        .question-area .explanation {
            padding: 16px 18px;
            border-radius: 16px;
            background: #f5f2ed;
            font-size: 14px;
            color: #5a4e44;
            line-height: 1.8;
            display: none;
            border-left: 4px solid #c49a6c;
            margin-top: 4px;
        }
        .question-area .explanation.show {
            display: block;
        }
        .question-area .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a7a6a;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        .question-area .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .footer {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-top: 14px;
            border-top: 1px solid #f0ede8;
            flex-wrap: wrap;
        }
        .footer button {
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1;
            min-width: 56px;
        }
        .footer button:active {
            transform: scale(0.96);
        }
        .footer .btn-prev {
            background: #c49a6c;
            color: #fff;
        }
        .footer .btn-prev:disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .footer .btn-next {
            background: #c49a6c;
            color: #fff;
        }
        .footer .btn-next:disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .footer .btn-finish {
            background: #4a6a8a;
            color: #fff;
        }
        .footer .btn-wrong {
            background: transparent;
            color: #4a6a8a;
            border: 1px solid #4a6a8a;
            flex: 0.7;
        }
        .footer .btn-wrong.active {
            background: #4a6a8a;
            color: #fff;
        }
    </style>
</head>

        let allQuestionsData = [];

        let isWrongMode = false;
        let returnIndex = 0;

        const questionText = document.getElementById('questionText');
        const questionMeta = document.getElementById('questionMeta');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const emptyState = document.getElementById('emptyState');
        const currentNum = document.getElementById('currentNum');
        const totalNum = document.getElementById('totalNum');

        // ============================================================

        backBtn.addEventListener('click', function() {
    var module = moduleFilter || '七上';

    sessionStorage.setItem('returnToModule', module);

});;

        // ============================================================
        // 错题本
        // ============================================================
        function getWrongQuestions() {
            try {
                const data = localStorage.getItem('wrongQuestions');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveWrongQuestions(data) {
            localStorage.setItem('wrongQuestions', JSON.stringify(data));
        }

        function addWrongQuestion(q, userAnswer) {
            const wrongList = getWrongQuestions();
            const exists = wrongList.some(item => item.id === q.id);
            if (!exists) {
                wrongList.push({
                    id: q.id,
                    module: q.module,
                    subject: q.subject,
                    unit: q.unit,
                    question: q.question,
                    options: q.options,
                    answer: q.answer,
                    userAnswer: userAnswer,
                    explanation: q.explanation
                });
                saveWrongQuestions(wrongList);
            }
        }

        function removeWrongQuestion(id) {
            let wrongList = getWrongQuestions();
            wrongList = wrongList.filter(item => item.id !== id);
            saveWrongQuestions(wrongList);
        }

        // ============================================================
        // 根据当前单元加载对应的 JSON 文件
        // ============================================================
        function saveProgress() {
    var data = {
        level: (currentModule || '') + '-' + (currentSubject || '') + '-' + (currentUnit || ''),
        index: currentIndex || 0,
        wrong: wrongList || []
    };
    try { localStorage.setItem('studyProgress', JSON.stringify(data)); } catch(e) {}
}
function loadProgress() {
    try {
        var raw = localStorage.getItem('studyProgress');
        return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
}
        function loadQuestions() {
            alert('加载的文件: ' + (window.currentQuestionsFile || '未设置'));
                var urlParams = new URLSearchParams(window.location.search);
    var isSprint = urlParams.get('sprint') === 'true';
    if (isSprint) {
        loadSprintQuestions();
        return;
    }
                        let fileName = null;
            if (unitFilter && unitFileMap[unitFilter]) {
                fileName = unitFileMap[unitFilter];
            } else if (moduleFilter === '七上' && subjectFilter === '历史') {
                // 如果没指定单元，默认加载史前时期
                fileName = 'q_七上_史前时期.json';
            } else {
                // 如果没有匹配的文件，尝试从单元名称推断
                if (unitFilter && unitFileMap[unitFilter]) {
                    fileName = unitFileMap[unitFilter];
                } else {
                    fileName = 'q_七上_史前时期.json';
                }
            }
            window.currentQuestionsFile = fileName;

            if (!fileName) {
                questionText.textContent = '❌ 未找到对应的题库文件。';
                return;
            }

            fetch('https://secondary-vocab.github.io/word-game/questions/' + fileName)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('文件加载失败，状态码：' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    allQuestionsData = data.questions || [];
                    loadNormalQuestions();
                    // 恢复进度
var saved = restoreProgress();
                    console.log('保存的进度:', localStorage.getItem('daofa_progress'));
console.log('当前 URL 参数:', window.location.search);
if (saved && saved.module === moduleFilter && saved.subject === subjectFilter && saved.unit === unitFilter) {
    if (saved.currentIndex < questions.length) {
        currentIndex = saved.currentIndex;
    }
}
                })
                .catch(error => {
                    console.error('题库加载失败:', error);
                    questionText.textContent = '❌ 题库加载失败，请检查网络或文件是否存在。';
                    questionText.style.color = '#c45a4a';
                });
        }

        function loadNormalQuestions() {
            let filtered = allQuestionsData;
            questions = filtered;
            isWrongMode = false;
            wrongBtn.textContent = '📒 错题';
            wrongBtn.classList.remove('active');
            if (returnIndex > 0 && returnIndex < questions.length) {
                currentIndex = returnIndex;
            } else {
                currentIndex = 0;
            }
            renderList();
        }

        function loadWrongQuestions() {
            const wrongList = getWrongQuestions();
            if (wrongList.length === 0) {
                alert('🎉 错题本为空！你还没有做错的题目。');
                return;
            }
            returnIndex = currentIndex;
            const matched = [];
            wrongList.forEach(w => {
                const found = allQuestionsData.find(q => q.id === w.id);
                if (found) {
                    matched.push(found);
                }
            });
            if (matched.length === 0) {
                alert('错题数据已失效，请重新刷题。');
                return;
            }
            questions = matched;
            isWrongMode = true;
            wrongBtn.textContent = '📖 全部';
            wrongBtn.classList.add('active');
            currentIndex = 0;
            renderList();
        }

        function renderList() {
            if (questions.length === 0) {
                emptyState.style.display = 'flex';
                totalNum.textContent = '0';
                if (isWrongMode) {
                    emptyState.querySelector('.icon').textContent = '🎉';
                    emptyState.querySelector('div:first-of-type').textContent = '错题本已清空！';
                    emptyState.querySelector('div:last-of-type').textContent = '继续刷题，错题会自动收录。';
                } else {
                    emptyState.querySelector('.icon').textContent = '📭';
                    emptyState.querySelector('div:first-of-type').textContent = '当前没有匹配的题目';
                    emptyState.querySelector('div:last-of-type').textContent = '请尝试其他年级或学科';
                }
                return;
            }
            emptyState.style.display = 'none';
            totalNum.textContent = questions.length;
            if (currentIndex >= questions.length) {
                currentIndex = 0;
            }
            renderQuestion(currentIndex);
        }

        // ============================================================
        // 渲染
        // ============================================================
        function renderQuestion(index) {
            if (!questions.length) return;
            const q = questions[index];
            currentNum.textContent = index + 1;
            questionText.textContent = q.question;
            // 显示题目配图
var imageContainer = document.getElementById('questionImage');
if (!imageContainer) {
    imageContainer = document.createElement('div');
    imageContainer.id = 'questionImage';
    imageContainer.style.cssText = 'margin-bottom: 12px; text-align: center;';
    // 插入到 questionText 前面
    var parent = optionsContainer.parentNode;
parent.insertBefore(imageContainer, optionsContainer);
}
if (q.image) {
    imageContainer.innerHTML = '<img src="' + q.image + '" style="max-width:100%; max-height:200px; border-radius:8px; border:1px solid #f0ede8;" alt="题目配图" />';
    imageContainer.style.display = 'block';
} else {
    imageContainer.style.display = 'none';
}
            questionMeta.textContent = q.module + ' · ' + q.subject + ' · ' + q.unit;

            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                html += `<div class="opt" data-index="${i}">${letters[i]}. ${opt}</div>`;
            });
            optionsContainer.innerHTML = html;

            answered = false;
            explanationBox.classList.remove('show');
            explanationBox.style.display = 'none';
            explanationBox.textContent = '';

            document.querySelectorAll('.opt').forEach(el => {
                el.addEventListener('click', function() {
                    if (answered) return;
                    const selected = parseInt(this.dataset.index);
                    handleAnswer(selected);
                });
            });

            prevBtn.disabled = (index === 0);
            if (index === questions.length - 1) {
                nextBtn.textContent = '📊 查看报告';
                nextBtn.className = 'btn-finish';
            } else {
                nextBtn.textContent = '下一题 →';
                nextBtn.className = 'btn-next';
            }
        saveProgress();
        }

        // ============================================================
        // 答题
        // ============================================================
        function handleAnswer(selected) {
            if (answered) return;
            const q = questions[currentIndex];
            const opts = document.querySelectorAll('.opt');
            const isCorrect = (selected === q.answer);

            opts.forEach(o => o.classList.add('disabled'));
            opts.forEach((o, i) => {
                if (i === q.answer) o.classList.add('correct');
                if (i === selected && !isCorrect) o.classList.add('wrong');
            });

            if (!isCorrect) {
                wrongList.push(q.id);
saveProgress();
                addWrongQuestion(q, selected);
            } else {
                removeWrongQuestion(q.id);
            }

            explanationBox.textContent = (isCorrect ? '✅ 回答正确！' : '❌ 回答错误') + ' 解析：' + q.explanation;
            explanationBox.style.display = 'block';
            explanationBox.classList.add('show');

            answered = true;
        }

        // ============================================================
        // 导航
        // ============================================================
        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function goToNext() {
            if (!answered) {
                const opts = document.querySelectorAll('.opt');
                opts.forEach(o => {
                    o.style.transition = 'all 0.1s';
                    o.style.borderColor = '#c45a4a';
                    setTimeout(() => { o.style.borderColor = ''; }, 400);
                });
                return;
            }
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                alert('🎉 恭喜完成全部 ' + questions.length + ' 题！');
                if (isWrongMode) {
                    loadNormalQuestions();
                }
            }
        }

        // ============================================================
        // 事件
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') goToPrev();
            if (e.key === 'ArrowRight') goToNext();
        });

        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);

        wrongBtn.addEventListener('click', function() {
            if (isWrongMode) {
                loadNormalQuestions();
                // 恢复进度
var saved = loadProgress();
if (saved && saved.file === window.currentQuestionsFile) {
    if (saved.currentIndex < questions.length) {
        currentIndex = saved.currentIndex;
    }
}
alert('恢复检查: ' + (localStorage.getItem('daofa_progress') || '无数据'));
                var saved = loadProgress();
if (saved) {
    var curLevel = (moduleFilter || '') + '-' + (subjectFilter || '') + '-' + (unitFilter || '');
    if (saved.level === curLevel && saved.index < questions.length) {
        currentIndex = saved.index;
    }
}
            } else {
                loadWrongQuestions();
            }
        });

        // ============================================================
        // 启动
        // ============================================================
        loadQuestions();
        console.log('✅ 刷题页面已加载（按单元动态读取，含4个单元映射）');
    function loadSprintQuestions() {
    var allFiles = [
        'q_七上_史前时期.json', 'q_七上_夏商周时期.json', 'q_七上_秦汉时期.json', 'q_七上_三国两晋南北朝时期.json',
        'q_七下_隋唐时期.json', 'q_七下_辽宋夏金元时期.json', 'q_七下_明清时期.json',
        'q_八上_中国开始沦为半殖民地半封建社会.json', 'q_八上_早期现代化的初步探索和民族危机加剧.json', 'q_八上_资产阶级民主革命与中华民国的建立.json', 'q_八上_新民主主义革命的兴起.json', 'q_八上_从国共合作到农村革命根据地的建立.json', 'q_八上_中华民族的抗日战争.json', 'q_八上_人民解放战争.json',
        'q_八下_中华人民共和国的成立和社会主义制度的建立.json', 'q_八下_社会主义建设道路的探索.json', 'q_八下_改革开放与中国特色社会主义的开创.json', 'q_八下_中国特色社会主义迈向21世纪.json', 'q_八下_新形势下坚持和发展中国特色社会主义.json', 'q_八下_中国特色社会主义进入新时代.json', 'q_八下_全面建设社会主义现代化国家.json',
        'q_九上_文明的产生和古代亚非文明.json', 'q_九上_古代欧洲文明.json', 'q_九上_封建时代的欧洲.json', 'q_九上_封建时代的亚洲国家.json', 'q_九上_走向近代.json', 'q_九上_资本主义制度的初步确立.json', 'q_九上_工业革命和国际共产主义运动的兴起.json',
        'q_九下_殖民地人民的反抗与资本主义制度的扩展.json', 'q_九下_第二次工业革命和近代科学文化.json', 'q_九下_第一次世界大战和战后初期的世界.json', 'q_九下_经济大危机和第二次世界大战.json', 'q_九下_二战后的世界变化.json', 'q_九下_走向和平发展的世界.json'
    ];
    var promises = allFiles.map(function(file) {
        return fetch('questions/' + file).then(function(res) {
            return res.ok ? res.json() : { questions: [] };
        }).catch(function() { return { questions: [] }; });
    });
    Promise.all(promises).then(function(results) {
        var allQuestions = [];
        results.forEach(function(data) {
            if (data.questions) {
                allQuestions = allQuestions.concat(data.questions);
            }
        });
        var historyQuestions = allQuestions.filter(function(q) { return q.subject === '历史'; });
        var politicsQuestions = allQuestions.filter(function(q) { return q.subject === '道法'; });
        function shuffle(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }
        var selected = shuffle(historyQuestions).slice(0, 14).concat(shuffle(politicsQuestions).slice(0, 14));
        questions = shuffle(selected);
        totalNum.textContent = questions.length;
        emptyState.style.display = 'none';
        renderQuestion(0);
    }).catch(function(e) {
        console.error('中考冲刺加载失败:', e);
        questionText.textContent = '❌ 题库加载失败，请检查网络。';
    });
}
   // ===== 保存刷题进度 =====
function saveProgress() {
    if (!questions || questions.length === 0) return;
    var q = questions[currentIndex];
    if (!q) return;
    var data = {
        module: q.module || '',
        subject: q.subject || '',
        unit: q.unit || '',
        currentIndex: currentIndex,
        total: questions.length,
        timestamp: Date.now()
    };
    try {
        localStorage.setItem('daofa_progress', JSON.stringify(data));
    } catch (e) {}
} 
    // ===== 恢复刷题进度 =====
function restoreProgress() {
    try {
        var raw = localStorage.getItem('daofa_progress');
        if (!raw) return null;
        var data = JSON.parse(raw);
        // 检查是否过期（超过24小时）
        if (Date.now() - data.timestamp > 24 * 60 * 60 * 1000) {
            localStorage.removeItem('daofa_progress');
            return null;
        }
        return data;
    } catch (e) {
        return null;
    }
}
