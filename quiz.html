<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>刷题 · 道法历史</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f2eb;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 780px;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px 18px 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0ede8;
            flex-shrink: 0;
        }
        .header .back {
            font-size: 28px;
            font-weight: 700;
            color: #4a6a8a;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 0.8;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            padding: 0 4px 0 0;
        }
        .header .progress {
            font-size: 14px;
            color: #8a7a6a;
            font-weight: 400;
        }
        .header .progress span {
            color: #2c241c;
            font-weight: 500;
        }

        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 0 12px;
            overflow-y: auto;
        }
        .question-area .meta {
            font-size: 12px;
            color: #b8a48a;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .question-area .q {
            font-size: 20px;
            font-weight: 500;
            color: #2c241c;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .question-area .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .question-area .options .opt {
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid #f0ede8;
            background: #faf8f6;
            font-size: 16px;
            color: #2c241c;
            cursor: pointer;
            transition: all 0.15s;
        }
        .question-area .options .opt:active {
            transform: scale(0.97);
        }
        .question-area .options .opt.correct {
            border-color: #5a8a5a;
            background: #eef5ed;
        }
        .question-area .options .opt.wrong {
            border-color: #c45a4a;
            background: #f5eeed;
        }
        .question-area .options .opt.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        .question-area .explanation {
            padding: 14px 16px;
            border-radius: 14px;
            background: #f5f2ed;
            font-size: 14px;
            color: #5a4e44;
            line-height: 1.7;
            display: none;
            border-left: 3px solid #c49a6c;
        }
        .question-area .explanation.show {
            display: block;
        }

        .footer {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            padding-top: 12px;
            border-top: 1px solid #f0ede8;
        }
        .footer button {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .footer .btn-prev {
            background: transparent;
            color: #8a7a6a;
            border: 1px solid #e8e0d8;
        }
        .footer .btn-prev:active {
            background: #f5f2ed;
        }
        .footer .btn-prev:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .footer .btn-next {
            background: #c49a6c;
            color: #fff;
        }
        .footer .btn-next:active {
            background: #b8864a;
        }
        .footer .btn-next:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .footer .btn-finish {
            background: #4a6a8a;
            color: #fff;
        }
        .footer .btn-finish:active {
            background: #3a5a7a;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8a7a6a;
            font-size: 16px;
            text-align: center;
            padding: 20px;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="app">
        <div class="header">
            <button class="back" onclick="window.history.back()">❮</button>
            <span class="progress">第 <span id="currentNum">1</span> / <span id="totalNum">0</span> 题</span>
        </div>

        <div class="question-area" id="questionArea">
            <div class="meta" id="questionMeta">七上 · 历史 · 史前时期</div>
            <div class="q" id="questionText">加载题目中...</div>
            <div class="options" id="optionsContainer"></div>
            <div class="explanation" id="explanationBox"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <div class="icon">📭</div>
                <div>当前没有匹配的题目</div>
                <div style="font-size:14px;margin-top:8px;color:#bbb;">请尝试其他年级或学科</div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-prev" id="prevBtn" disabled>← 上一题</button>
            <button class="btn-next" id="nextBtn">下一题 →</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 题库直接写在代码里（暂时不依赖 questions.json）
        // ============================================================
        const QUESTIONS = [
            {
                "id": 1,
                "module": "七上",
                "subject": "历史",
                "unit": "史前时期",
                "question": "我国最早的人类是？",
                "options": ["元谋人", "北京人", "山顶洞人", "蓝田人"],
                "answer": 0,
                "explanation": "元谋人是我国最早的人类，距今约170万年。"
            },
            {
                "id": 2,
                "module": "七上",
                "subject": "历史",
                "unit": "史前时期",
                "question": "北京人遗址位于哪个地区？",
                "options": ["北京西南周口店", "陕西西安半坡", "浙江余姚河姆渡", "河南安阳殷墟"],
                "answer": 0,
                "explanation": "北京人遗址位于北京西南周口店龙骨山上。"
            },
            {
                "id": 3,
                "module": "七上",
                "subject": "历史",
                "unit": "夏商周时期",
                "question": "夏朝的建立者是？",
                "options": ["禹", "启", "桀", "汤"],
                "answer": 0,
                "explanation": "约公元前2070年，禹建立夏朝，是中国历史上第一个王朝。"
            },
            {
                "id": 4,
                "module": "七上",
                "subject": "历史",
                "unit": "夏商周时期",
                "question": "西周实行分封制的目的是？",
                "options": ["发展农业生产", "巩固周朝统治", "推行法治", "促进商业发展"],
                "answer": 1,
                "explanation": "西周实行分封制的目的是为了巩固周王朝的统治。"
            },
            {
                "id": 5,
                "module": "七上",
                "subject": "历史",
                "unit": "秦汉时期",
                "question": "秦统一六国是在哪一年？",
                "options": ["公元前230年", "公元前221年", "公元前210年", "公元前207年"],
                "answer": 1,
                "explanation": "公元前221年，秦王嬴政灭六国，建立了中国历史上第一个统一的多民族的中央集权国家。"
            },
            {
                "id": 6,
                "module": "七上",
                "subject": "历史",
                "unit": "秦汉时期",
                "question": "汉武帝采纳谁的建议实行了\"罢黜百家，独尊儒术\"？",
                "options": ["董仲舒", "主父偃", "卫青", "霍去病"],
                "answer": 0,
                "explanation": "汉武帝采纳董仲舒的建议，实行\"罢黜百家，独尊儒术\"，使儒学成为中国封建社会的正统思想。"
            },
            {
                "id": 7,
                "module": "七上",
                "subject": "历史",
                "unit": "三国两晋南北朝时期",
                "question": "官渡之战的交战双方是？",
                "options": ["曹操与袁绍", "曹操与孙权", "刘备与曹操", "孙权与刘备"],
                "answer": 0,
                "explanation": "官渡之战中，曹操以少胜多，击败了袁绍，为统一北方奠定了基础。"
            },
            {
                "id": 8,
                "module": "七上",
                "subject": "历史",
                "unit": "三国两晋南北朝时期",
                "question": "赤壁之战的交战双方是？",
                "options": ["曹操与孙权、刘备联军", "曹操与袁绍", "孙权与刘备", "曹操与孙权"],
                "answer": 0,
                "explanation": "赤壁之战中，孙刘联军以少胜多，击败了曹操，为三国鼎立局面的形成奠定了基础。"
            },
            {
                "id": 9,
                "module": "七上",
                "subject": "道法",
                "unit": "少年有梦",
                "question": "少年的梦想应该与什么紧密相连？",
                "options": ["个人喜好", "时代脉搏", "家庭期望", "朋友选择"],
                "answer": 1,
                "explanation": "少年的梦想应该与时代脉搏紧密相连，与中国梦密不可分。"
            },
            {
                "id": 10,
                "module": "七上",
                "subject": "道法",
                "unit": "成长的时空",
                "question": "处理冲突的基本策略是？",
                "options": ["保持冷静、沟通协商", "争吵对抗", "逃避问题", "求助于第三方"],
                "answer": 0,
                "explanation": "处理冲突的基本策略是保持冷静、沟通协商。"
            }
        ];

        // ============================================================
        // 从URL获取参数
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const moduleFilter = urlParams.get('module') || null;
        const subjectFilter = urlParams.get('subject') || null;

        let filteredQuestions = [];
        let currentIndex = 0;
        let answered = false;

        const questionText = document.getElementById('questionText');
        const questionMeta = document.getElementById('questionMeta');
        const optionsContainer = document.getElementById('optionsContainer');
        const explanationBox = document.getElementById('explanationBox');
        const emptyState = document.getElementById('emptyState');
        const currentNum = document.getElementById('currentNum');
        const totalNum = document.getElementById('totalNum');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        // ============================================================
        // 加载题库（直接从代码中读取）
        // ============================================================
        function loadQuestions() {
            filteredQuestions = QUESTIONS;
            if (moduleFilter) {
                filteredQuestions = filteredQuestions.filter(q => q.module === moduleFilter);
            }
            if (subjectFilter) {
                filteredQuestions = filteredQuestions.filter(q => q.subject === subjectFilter);
            }

            if (filteredQuestions.length === 0) {
                document.getElementById('questionArea').querySelector('.meta').style.display = 'none';
                document.getElementById('questionArea').querySelector('.q').style.display = 'none';
                document.getElementById('optionsContainer').style.display = 'none';
                document.getElementById('explanationBox').style.display = 'none';
                emptyState.style.display = 'flex';
                totalNum.textContent = '0';
                return;
            }

            emptyState.style.display = 'none';
            document.getElementById('questionArea').querySelector('.meta').style.display = 'block';
            document.getElementById('questionArea').querySelector('.q').style.display = 'block';
            document.getElementById('optionsContainer').style.display = 'flex';
            document.getElementById('explanationBox').style.display = 'none';
            totalNum.textContent = filteredQuestions.length;
            renderQuestion(0);
        }

        function renderQuestion(index) {
            if (!filteredQuestions.length) return;
            const q = filteredQuestions[index];
            currentNum.textContent = index + 1;
            questionText.textContent = q.question;
            questionMeta.textContent = q.module + ' · ' + q.subject + ' · ' + q.unit;

            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                html += `<div class="opt" data-index="${i}">${letters[i]}. ${opt}</div>`;
            });
            optionsContainer.innerHTML = html;

            answered = false;
            explanationBox.classList.remove('show');
            explanationBox.style.display = 'none';
            explanationBox.textContent = '';

            document.querySelectorAll('.opt').forEach(el => {
                el.addEventListener('click', function() {
                    if (answered) return;
                    const selected = parseInt(this.dataset.index);
                    handleAnswer(selected);
                });
            });

            prevBtn.disabled = (index === 0);
            if (index === filteredQuestions.length - 1) {
                nextBtn.textContent = '📊 查看报告';
                nextBtn.className = 'btn-finish';
            } else {
                nextBtn.textContent = '下一题 →';
                nextBtn.className = 'btn-next';
            }
        }

        function handleAnswer(selected) {
            if (answered) return;
            const q = filteredQuestions[currentIndex];
            const opts = document.querySelectorAll('.opt');
            const isCorrect = (selected === q.answer);

            opts.forEach(o => o.classList.add('disabled'));
            opts.forEach((o, i) => {
                if (i === q.answer) o.classList.add('correct');
                if (i === selected && !isCorrect) o.classList.add('wrong');
            });

            explanationBox.textContent = (isCorrect ? '✅ 回答正确！' : '❌ 回答错误') + ' 解析：' + q.explanation;
            explanationBox.style.display = 'block';
            explanationBox.classList.add('show');

            answered = true;
        }

        function goToPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function goToNext() {
            if (!answered) {
                const opts = document.querySelectorAll('.opt');
                opts.forEach(o => {
                    o.style.transition = 'all 0.1s';
                    o.style.borderColor = '#c45a4a';
                    setTimeout(() => { o.style.borderColor = ''; }, 400);
                });
                return;
            }
            if (currentIndex < filteredQuestions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                alert('🎉 恭喜完成全部 ' + filteredQuestions.length + ' 题！\n诊断报告功能即将上线。');
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') goToPrev();
            if (e.key === 'ArrowRight') goToNext();
        });

        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);

        loadQuestions();
        console.log('✅ 刷题页面已加载，模块筛选：', moduleFilter, '学科筛选：', subjectFilter);
    </script>

</body>
</html>
