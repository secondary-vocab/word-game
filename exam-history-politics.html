<!DOCTYPE html>
<html lang="zh-CN">

        }

        }
        .login-btn {

        }

        .progress-area {

            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
        }
        .level-info {

            margin-bottom: 8px;
            font-size: 14px;
            color: #475569;
        }

            background: #e2e8f0;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
        }

            padding: 28px 24px 16px;

            font-weight: 600;
            line-height: 1.4;
            color: #1e293b;
            margin-bottom: 20px;

        .options-area {

            grid-template-columns: 1fr 1fr;

            margin-bottom: 20px;
        }

            background: #f8fafc;

            border-radius: 60px;

            text-align: left;

            border-color: #22c55e;
            color: #166534;
        }

            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

            padding: 0 24px 28px;

            font-size: 16px;
            font-weight: bold;
            border: none;

            background: #f1f5f9;
            color: #475569;
        }
        .next-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);

            background: #ef4444;
            color: white;

            border-radius: 40px;

    </style>
</head>
<body>
<div class="login-container" id="loginContainer">
    <h2>📚 道法历史冲刺</h2>
    <p>输入手机号验证授权</p>
    <input type="tel" id="phoneNumber" class="phone-input" placeholder="11位手机号" maxlength="11">
    <button id="doLoginBtn" class="login-btn">验证并登录</button>
    <div class="trial-note">
        🔓 试用手机：13900000000（前10题）<br>
        ✅ 正式授权：13971005659
    </div>
</div>

<div class="game-wrapper" id="gameContainer">
    <div class="game-nav">
        <div class="subject-switch">
            <button class="subject-btn active" data-subject="history">📜 历史</button>
            <button class="subject-btn" data-subject="daofa">📖 道德与法治</button>
        </div>
        <div class="stats-row">
            <span class="score-box">🏆 得分: <span id="scoreValue">0</span></span>
            <span class="accuracy-box">📊 正确率: <span id="accuracyValue">0</span>%</span>
            <button class="wrongnote-btn" id="wrongNoteBtn">📋 错题本</button>
        </div>
    </div>
    <div class="progress-area">
        <div class="level-info">
            <span id="levelName">第1关 · 历史</span>
            <span id="questionProgress">0/20 题</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>
    <div class="question-area">
        <div class="question-text" id="questionText">加载中...</div>
        <div class="options-area" id="optionsArea"></div>
        <div class="explain-area" id="explainArea"></div>
    </div>
    <div class="action-buttons">
        <button class="redo-btn" id="redoBtn">🔄 重做本题</button>
        <button class="next-btn" id="nextBtn">下一题 ➡️</button>
        <button class="reset-level-btn" id="resetLevelBtn" style="display:none;">🔄 重做本关</button>
    </div>
</div>

let levelScore = 0;

let currentQuestionData = null;
let isTrialMode = false;
let trialCount = 0;
let subjectState = {
    history: { level: 1, index: 0, score: 0, answers: [], wrongList: [] },
    daofa: { level: 1, index: 0, score: 0, answers: [], wrongList: [] }
};
let wrongList = [];

let questionTextEl, optionsArea, explainArea, scoreValueEl, accuracyValueEl;
let questionProgressEl, levelNameEl, progressFillEl, redoBtn, nextBtn, resetLevelBtn, wrongNoteBtn;

// ================= 辅助函数 =================
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;

function updateUI() {
    const total = currentQuestions.length;
    const answered = levelAnswers.filter(a => a !== undefined).length;
    const percent = total > 0 ? (answered / total) * 100 : 0;
    progressFillEl.style.width = `${percent}%`;
    questionProgressEl.innerText = `${answered}/${total} 题`;
    
    const maxScore = total * 5;
    scoreValueEl.innerText = `${levelScore}/${maxScore}`;
    const correctCount = levelAnswers.filter(v => v === true).length;
    const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
    accuracyValueEl.innerText = accuracy;
    levelNameEl.innerText = `第${currentLevel}关 · ${currentSubject === 'history' ? '历史' : '道德与法治'}`;
}

function renderStars(difficulty) {
    let stars = '';
    for (let i = 1; i <= 5; i++) {
        stars += i <= difficulty ? '★' : '☆';
    }
    return stars;
}

function renderCurrentQuestion() {
    if (!currentQuestions.length || currentIndex >= currentQuestions.length) return;
    const q = currentQuestions[currentIndex];
    currentQuestionData = q;
    questionTextEl.innerText = q.text;
    
    // 显示难度星级
    const starHtml = `<div style="margin-bottom: 12px; font-size: 18px; letter-spacing: 4px; color: #ffb800;">${renderStars(q.difficulty)}</div>`;
    if (!document.querySelector('.star-display')) {
        questionTextEl.insertAdjacentHTML('beforebegin', starHtml);
    } else {
        document.querySelector('.star-display').innerHTML = renderStars(q.difficulty);
    }
    
    optionsArea.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `${String.fromCharCode(65+idx)}. ${opt}`;
        btn.className = 'option-item';
        btn.addEventListener('click', () => handleAnswer(idx));
        optionsArea.appendChild(btn);
    });
    
    explainArea.classList.remove('show');
    explainArea.innerHTML = '';
    gameLocked = false;
    resetLevelBtn.style.display = 'none';
    
    // 恢复已答状态
    if (levelAnswers[currentIndex] !== undefined) {
        const wasCorrect = levelAnswers[currentIndex];
        gameLocked = true;
        const btns = document.querySelectorAll('.option-item');
        btns.forEach(btn => btn.classList.add('disabled-opt'));
        const correctIdx = q.correct;
        btns[correctIdx]?.classList.add('correct-highlight');
        if (q.explain) {
            explainArea.innerHTML = q.explain;
            explainArea.classList.add('show');
        }
    }
    updateUI();
}

        levelScore += 5;
        if (isTrialMode) trialCount++;

        // 记录错题
        wrongList.push({
            id: Date.now() + Math.random(),
            text: q.text,
            userAnswer: q.options[selectedIdx],
            correctAnswer: q.options[q.correct],
            explain: q.explain,
            subject: currentSubject,
            level: currentLevel
        });
    }
    
    const btns = document.querySelectorAll('.option-item');
    btns.forEach((btn, idx) => {
        btn.classList.add('disabled-opt');
        if (idx === q.correct) btn.classList.add('correct-highlight');
        if (idx === selectedIdx && idx !== q.correct) btn.classList.add('wrong-highlight');
    });
    
    if (q.explain) {
        explainArea.innerHTML = q.explain;
    } else {
        explainArea.innerHTML = isCorrect ? '✅ 回答正确！' : `❌ 回答错误。正确答案：${q.options[q.correct]}`;
    }
    explainArea.classList.add('show');
    
    gameLocked = true;
    updateUI();
    
    if (isTrialMode && trialCount >= 10) {
        setTimeout(() => alert('试用结束，已完成10道题。如需继续学习全部400题，请联系客服购买授权。'), 200);
    }
}

function redoCurrentQuestion() {
    if (!gameLocked && levelAnswers[currentIndex] === undefined) {
        alert('请先完成当前题目');
        return;
    }
    const wasCorrect = levelAnswers[currentIndex];
    if (wasCorrect === true) {
        levelScore -= 5;
    }
    levelAnswers[currentIndex] = undefined;
    gameLocked = false;
    renderCurrentQuestion();
}

function resetLevel() {
    if (confirm('确定重新开始当前关卡吗？当前进度会丢失')) {
        loadLevel(currentSubject, currentLevel);
    }
}

function nextQuestion() {
    if (!gameLocked && levelAnswers[currentIndex] === undefined) {
        alert('请先回答当前题目');
        return;
    }
    
    if (currentIndex + 1 < currentQuestions.length) {
        currentIndex++;
        renderCurrentQuestion();
    } else {
        // 关卡结束
        const total = currentQuestions.length;
        const correctCount = levelAnswers.filter(v => v === true).length;
        const passRate = correctCount / total;
        const isPass = passRate >= 0.8;
        
        if (isPass) {
            if (currentLevel < 20) {
                alert(`🎉 恭喜过关！正确率${Math.round(passRate*100)}%，进入第${currentLevel+1}关`);
                currentLevel++;
                loadLevel(currentSubject, currentLevel);
            } else {
                alert(`🏆 恭喜通关！你已完成全部20关！\n最终得分：${levelScore}/${total*5}`);
                if (confirm('是否重新开始？')) {
                    currentLevel = 1;
                    loadLevel(currentSubject, 1);
                }
            }
        } else {
            resetLevelBtn.style.display = 'block';
            explainArea.innerHTML = `❌ 闯关失败！正确率${Math.round(passRate*100)}%（需要≥80%），请点击“重做本关”重新挑战`;
            explainArea.classList.add('show');
            gameLocked = true;
        }
    }
}
