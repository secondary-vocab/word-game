    <style>

            padding: 14px;

            border-radius: 60px;

            width: 90%;
            text-align: center;

        .login-btn {
            background: #0f172a;

            border-radius: 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .score-box, .accuracy-box {
            background: rgba(0,0,0,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .wrongnote-btn {
            background: #f59e0b;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }
        .progress-area {
            background: #f1f5f9;
            padding: 12px 20px;
        }
        .level-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .progress-bar-bg {
            background: #e2e8f0;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            height: 100%;
            transition: width 0.2s;
        }
        .question-area { padding: 20px; }
        .difficulty-stars {
            font-size: 18px;
            color: #ffb800;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .options-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            padding: 12px 16px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }
        .option-item.correct-highlight { background: #dcfce7; border-color: #22c55e; }
        .option-item.wrong-highlight { background: #fee2e2; border-color: #ef4444; }
        .option-item.disabled-opt { cursor: default; opacity: 0.7; }
        .explain-area {
            background: #eef2ff;
            border-radius: 16px;
            padding: 12px;
            font-size: 14px;
            color: #1e40af;
            display: none;
        }
        .explain-area.show { display: block; }
        .action-buttons {
            display: flex;
            gap: 12px;
            padding: 0 20px 20px;
        }
        .redo-btn, .next-btn {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .redo-btn { background: #f1f5f9; }
        .next-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .level-result {
            background: white;
            border-radius: 32px;
            padding: 24px;
            text-align: center;
            margin: 20px;
        }
    </style>
</head>
<body>
<div class="game-container" id="app">
    <div id="loginPanel" class="phone-login">

        </div>
        <div class="question-area">

            <div class="question-text" id="questionText">加载中...</div>

        <div class="action-buttons">

        </div>

</div>

<script>
// ================= 全局变量 =================
let currentSubject = "history";
let currentLevel = 1;
let currentQuestions = [];
let currentIndex = 0;
let levelScore = 0;
let levelAnswers = [];
let questionLocked = false;
let isTrialMode = false;
let trialCount = 0;
const TRIAL_LIMIT = 10;
const TRIAL_PHONE = "13900000000";
const FULL_PHONE = "13971005659";

let wrongListHistory = [];
let wrongListDaofa = [];
let subjectProgress = {
    history: { level: 1, score: 0, answers: [], currentIndex: 0 },
    daofa: { level: 1, score: 0, answers: [], currentIndex: 0 }
};

// ================= 题库数据（第1-80题） =================

        correct: 0,
        difficulty: 2,
        explain: "社会主义核心价值观个人层面：爱国、敬业、诚信、友善。"
    });
}

// 历史第1-40题（简单题，2星）
for (let i = 1; i <= 40; i++) {
    historyQuestions.push({
        text: `历史基础题${i}：中国近代史上第一个不平等条约是？`,
        options: ["《南京条约》", "《北京条约》", "《马关条约》", "《辛丑条约》"],
        correct: 0,
        difficulty: 2,
        explain: "1842年《南京条约》是中国近代第一个不平等条约。"
    });
}

// ================= 随机打乱函数 =================
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// 打乱题库
daofaQuestions = shuffleArray(daofaQuestions);
historyQuestions = shuffleArray(historyQuestions);

console.log("第1段加载完成，道法题数：" + daofaQuestions.length + "，历史题数：" + historyQuestions.length);<script>

        options: ["人民代表大会制度", "中国共产党领导的多党合作制", "民族区域自治制度", "基层群众自治制度"],

        explain: "人民代表大会制度是我国的根本政治制度。"
    });
}
// 历史41-80（中等题，3星）
for (let i = 41; i <= 80; i++) {
    historyQuestions.push({
        text: `历史中等题${i}：下列哪项是洋务运动的口号？`,
        options: ["自强求富", "救亡图存", "民主科学", "变法图强"],
        correct: 0,
        difficulty: 3,
        explain: "洋务运动以'自强'、'求富'为口号。"
    });
}

// ================= 第121-160题：道法81-120 + 历史81-120 =================
// 道法81-120（困难题，4-5星）
for (let i = 81; i <= 120; i++) {
    let diff = i <= 100 ? 4 : 5;
    daofaQuestions.push({
        text: `道法困难题${i}：结合2026年两会精神，我国发展新质生产力的核心要素是？`,
        options: ["科技创新", "资源投入", "人口红利", "政策支持"],
        correct: 0,
        difficulty: diff,
        explain: "科技创新是发展新质生产力的核心要素。"
    });
}
// 历史81-120（困难题，4-5星）
for (let i = 81; i <= 120; i++) {
    let diff = i <= 100 ? 4 : 5;
    historyQuestions.push({
        text: `历史困难题${i}：对比戊戌变法和明治维新，中国变法失败的主要原因是？`,
        options: ["封建顽固势力强大", "缺乏民众支持", "变法措施不当", "列强干涉"],

}

// 确保目前道法120题，历史120题（共240题）
console.log("第2段完成：道法现有" + daofaQuestions.length + "题，历史现有" + historyQuestions.length + "题");

// ================= 核心游戏函数（登录、关卡、渲染等） =================
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// 最终打乱全部题库（保证随机顺序）
daofaQuestions = shuffleArray(daofaQuestions);
historyQuestions = shuffleArray(historyQuestions);

function getQuestionsForLevel(subject, level) {
    const source = subject === 'history' ? historyQuestions : daofaQuestions;
    const start = (level - 1) * 20;
    return source.slice(start, start + 20);
}

function loadLevel() {
    currentQuestions = getQuestionsForLevel(currentSubject, currentLevel);
    currentIndex = 0;
    levelScore = 0;
    levelAnswers = [];
    questionLocked = false;
    renderQuestion();
    updateUI();
}

function renderQuestion() {
    if (!currentQuestions.length || currentIndex >= currentQuestions.length) return;
    const q = currentQuestions[currentIndex];
    document.getElementById('questionText').innerText = q.text;
    let stars = '';
    for (let i = 1; i <= 5; i++) stars += (i <= q.difficulty) ? '★' : '☆';
    document.getElementById('starDisplay').innerHTML = stars;
    
    const optionsDiv = document.getElementById('optionsArea');
    optionsDiv.innerHTML = '';
    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.innerText = `${String.fromCharCode(65+idx)}. ${opt}`;
        btn.className = 'option-item';
        btn.onclick = () => handleAnswer(idx);
        optionsDiv.appendChild(btn);
    });
    
    document.getElementById('explainArea').classList.remove('show');
    document.getElementById('explainArea').innerHTML = '';
    questionLocked = false;
    updateUI();
}

function updateUI() {
    const total = currentQuestions.length;
    const answered = levelAnswers.length;
    const percent = total > 0 ? (answered / total) * 100 : 0;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('questionProgress').innerText = `${answered}/${total} 题`;
    const maxScore = total * 5;
    const correctCount = levelAnswers.filter(v => v === true).length;
    const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
    document.getElementById('scoreValue').innerText = `${levelScore}/${maxScore}`;
    document.getElementById('accuracyValue').innerText = accuracy;
    document.getElementById('levelName').innerText = `第${currentLevel}关 · ${currentSubject === 'history' ? '历史' : '道法'}`;
}

function handleAnswer(selected) {
    if (questionLocked) return;
    const q = currentQuestions[currentIndex];
    const isCorrect = (selected === q.correct);
    if (isTrialMode && trialCount >= TRIAL_LIMIT) {
        alert('试用次数已用完');
        return;
    }
    levelAnswers[currentIndex] = isCorrect;
    if (isCorrect) {
        levelScore += 5;
        if (isTrialMode) trialCount++;
    } else {
        const wrongItem = {
            text: q.text,
            userAnswer: q.options[selected],
            correctAnswer: q.options[q.correct],
            explain: q.explain
        };
        if (currentSubject === 'history') {
            wrongListHistory.push(wrongItem);
            localStorage.setItem('wrongList_history', JSON.stringify(wrongListHistory));
        } else {
            wrongListDaofa.push(wrongItem);
            localStorage.setItem('wrongList_daofa', JSON.stringify(wrongListDaofa));
        }
        if (isTrialMode) trialCount++;
    }
    // UI高亮
    const btns = document.querySelectorAll('.option-item');
    btns.forEach((btn, idx) => {
        btn.classList.add('disabled-opt');
        if (idx === q.correct) btn.classList.add('correct-highlight');
        if (idx === selected && idx !== q.correct) btn.classList.add('wrong-highlight');
    });
    const explainDiv = document.getElementById('explainArea');
    explainDiv.innerHTML = q.explain || (isCorrect ? '✅ 正确' : `❌ 正确答案：${q.options[q.correct]}`);
    explainDiv.classList.add('show');
    questionLocked = true;
    updateUI();
    saveProgress();
}

function saveProgress() {
    subjectProgress[currentSubject] = { level: currentLevel, score: levelScore, answers: levelAnswers, currentIndex: currentIndex };
    localStorage.setItem('subjectProgress', JSON.stringify(subjectProgress));
}

function nextQuestion() {
    if (!questionLocked && levelAnswers[currentIndex] === undefined) {
        alert('请先回答本题');
        return;
    }
    if (currentIndex + 1 < currentQuestions.length) {
        currentIndex++;
        renderQuestion();
    } else {
        const total = currentQuestions.length;
        const correctCount = levelAnswers.filter(v => v === true).length;
        const passRate = correctCount / total;
        if (passRate >= 0.8) {
            if (currentLevel < 20) {
                alert(`🎉 过关！进入第${currentLevel+1}关`);
                currentLevel++;
                loadLevel();
            } else {
                alert('🏆 恭喜通关！');
                const div = document.createElement('div');
                div.className = 'level-result';
                div.innerHTML = '<h3>🏆 通关！</h3><button onclick="location.reload()">重新开始</button>';
                document.querySelector('.question-area').after(div);
            }
        } else {
            alert(`❌ 未过关（${Math.round(passRate*100)}%），重做本关`);
            if (!document.getElementById('retryBtn')) {
                const btn = document.createElement('button');
                btn.id = 'retryBtn';
                btn.innerText = '重做本关';
                btn.className = 'redo-btn';
                btn.onclick = () => { loadLevel(); btn.remove(); };
                document.querySelector('.action-buttons').after(btn);
            }
        }
    }
}

function redoCurrentQuestion() {
    if (!questionLocked && levelAnswers[currentIndex] === undefined) {
        alert('请先完成本题');
        return;
    }
    if (levelAnswers[currentIndex] === true) levelScore -= 5;
    levelAnswers[currentIndex] = undefined;
    questionLocked = false;
    renderQuestion();
}

// 登录逻辑
document.addEventListener('DOMContentLoaded', () => {
    const loginBtn = document.getElementById('doLoginBtn');
    loginBtn.addEventListener('click', () => {
        const phone = document.getElementById('phoneNumber').value.trim();
        if (!phone || phone.length !== 11) { alert('请输入11位手机号'); return; }
        if (phone === TRIAL_PHONE) {
            isTrialMode = true;
            trialCount = 0;
            alert('试用模式');
            startGame();
        } else if (phone === FULL_PHONE) {
            isTrialMode = false;
            alert('正式授权');
            startGame();
        } else {
            alert('未授权');
        }
    });
});

function startGame() {
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('gamePanel').style.display = 'block';
    loadLevel();
}

// 按钮绑定
document.getElementById('nextBtn').onclick = nextQuestion;
document.getElementById('redoBtn').onclick = redoCurrentQuestion;<script>

console.log("第3段完成：道法现有" + daofaQuestions.length + "题，历史现有" + historyQuestions.length + "题");

// ================= 学科切换（独立保存进度） =================
function switchSubject(subject) {
    if (subject === currentSubject) return;
    // 保存当前进度
    subjectProgress[currentSubject] = { level: currentLevel, score: levelScore, answers: levelAnswers, currentIndex: currentIndex };
    currentSubject = subject;
    // 恢复新学科进度
    if (subjectProgress[currentSubject]) {
        currentLevel = subjectProgress[currentSubject].level || 1;
        levelScore = subjectProgress[currentSubject].score || 0;
        levelAnswers = subjectProgress[currentSubject].answers || [];
        currentIndex = subjectProgress[currentSubject].currentIndex || 0;
    } else {
        currentLevel = 1;
        levelScore = 0;
        levelAnswers = [];
        currentIndex = 0;
    }
    loadLevel();
    // 更新按钮样式
    document.querySelectorAll('.subject-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.subject === subject);
    });
    saveProgress();
}

// 绑定学科切换按钮
document.querySelectorAll('.subject-btn').forEach(btn => {
    btn.onclick = () => switchSubject(btn.dataset.subject);
});

// ================= 错题本功能（基础） =================
function showWrongNotes() {
    const wrongs = currentSubject === 'history' ? wrongListHistory : wrongListDaofa;
    if (wrongs.length === 0) {
        alert('暂无错题，继续加油！');
        return;
    }
    let msg = '📖 错题本：\n\n';
    wrongs.forEach((w, idx) => {
        msg += `${idx+1}. ${w.text}\n   你的答案: ${w.userAnswer}\n   正确答案: ${w.correctAnswer}\n   解析: ${w.explain}\n\n`;
    });
    alert(msg);
    if (confirm('是否重做所有错题？')) {
        redoAllWrong();
    }
}

let isWrongMode = false;
let savedNormalState = null;

function redoAllWrong() {
    const wrongs = currentSubject === 'history' ? wrongListHistory : wrongListDaofa;
    if (wrongs.length === 0) {
        alert('暂无错题');
        return;
    }
    
    // 保存当前正常游戏状态
    savedNormalState = {
        questions: [...currentQuestions],
        index: currentIndex,
        score: levelScore,
        answers: [...levelAnswers],
        level: currentLevel
    };
    
    isWrongMode = true;
    let currentWrongIdx = 0;
    
    function showNextWrong() {
        if (currentWrongIdx >= wrongs.length) {
            alert('🎉 错题练习完成！所有错题已清空。');
            // 清空错题本
            if (currentSubject === 'history') {
                wrongListHistory = [];
                localStorage.setItem('wrongList_history', '[]');
            } else {
                wrongListDaofa = [];
                localStorage.setItem('wrongList_daofa', '[]');
            }
            // 恢复游戏状态
            if (savedNormalState) {
                currentQuestions = savedNormalState.questions;
                currentIndex = savedNormalState.index;
                levelScore = savedNormalState.score;
                levelAnswers = savedNormalState.answers;
                currentLevel = savedNormalState.level;
            }
            isWrongMode = false;
            renderQuestion();
            updateUI();
            return;
        }
        
        const w = wrongs[currentWrongIdx];
        // 构造错题练习题目（正确答案放在第一个选项）
        const fakeQ = {
            text: w.text,
            options: [w.correctAnswer, w.userAnswer, '其他选项A', '其他选项B'],
            correct: 0,
            explain: w.explain
        };
        
        // 临时替换当前题目
        currentQuestions = [fakeQ];
        currentIndex = 0;
        levelScore = 0;
        levelAnswers = [];
        renderQuestion();
        
        // 临时替换作答函数
        const originalHandle = window.handleAnswer;
        window.handleAnswer = function(selected) {
            const isCorrect = (selected === 0);
            if (isCorrect) {
                // 答对了，从错题本中移除
                wrongs.splice(currentWrongIdx, 1);
                if (currentSubject === 'history') {
                    localStorage.setItem('wrongList_history', JSON.stringify(wrongs));
                } else {
                    localStorage.setItem('wrongList_daofa', JSON.stringify(wrongs));
                }
                alert('✅ 答对了！已从错题本移除');
                window.handleAnswer = originalHandle;
                showNextWrong();
            } else {
                alert(`❌ 答错了！正确答案是：${fakeQ.options[0]}\n继续练习下一题`);
                currentWrongIdx++;
                window.handleAnswer = originalHandle;
                showNextWrong();
            }
        };
    }
    showNextWrong();
}
