<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        /* ===== 重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 8px 10px 8px;
            margin-bottom: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 15px;
            font-weight: 600;
            color: #2c241c;
            margin-bottom: 8px;
            text-align: left;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            color: #8a7a6a;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 14px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
        }
        .calendar-days .day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 600;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 学科切换 ===== */
        .subject-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        .subject-tab {
            flex: 1;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            color: #fff;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            height: 50px;
            background-color: transparent;
            background-size: cover;
            background-position: center;
        }
        .subject-tab::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 14px;
            z-index: 0;
        }
        .subject-tab span {
            position: relative;
            z-index: 1;
        }
        .subject-tab:active {
            transform: scale(0.96);
        }
        .subject-tab.active {
            box-shadow: 0 0 0 2px #c49a6c, 0 2px 12px rgba(196, 154, 108, 0.20);
        }

        /* 历史：暖色旧纸张质感 */
        .subject-tab.history-tab {
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 12px,
                    rgba(180, 150, 120, 0.06) 12px, rgba(180, 150, 120, 0.06) 13px),
                repeating-linear-gradient(-45deg, transparent, transparent 12px,
                    rgba(180, 150, 120, 0.04) 12px, rgba(180, 150, 120, 0.04) 13px),
                radial-gradient(circle at 30% 40%, #d4c4b0 0%, #b8a48a 70%, #9a8a78 100%);
            background-blend-mode: overlay, overlay, normal;
        }

        /* 道法：冷色书架质感 */
        .subject-tab.politics-tab {
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 14px,
                    rgba(160, 175, 190, 0.08) 14px, rgba(160, 175, 190, 0.08) 15px),
                repeating-linear-gradient(90deg, transparent, transparent 14px,
                    rgba(160, 175, 190, 0.06) 14px, rgba(160, 175, 190, 0.06) 15px),
                radial-gradient(circle at 60% 30%, #8a9aaa 0%, #6a7a8a 60%, #4d5d6d 100%);
            background-blend-mode: overlay, overlay, normal;
        }

        /* ===== 两列网格 ===== */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        .grid-row {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }
        .grid-row .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ===== 卡片 ===== */
        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            flex: 1;
            min-height: 0;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }

        /* ===== 大模块（占3格） ===== */
        .card-module.large {
            flex: 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #faf8f6;
            border-color: #e8e0d8;
            min-height: 0;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 700;
            color: #c49a6c;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        /* ===== 小模块（占1格） ===== */
        .card-module.small {
            padding: 8px 12px;
            flex: 1;
            min-height: 0;
        }
        .card-module.small .label {
            font-size: 14px;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
        }

        /* 小模块颜色 */
        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #b0a8a0;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(176, 168, 160, 0.20);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn-primary:active {
            background: #9a928a;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section { padding: 4px 6px 6px 6px; margin-bottom: 10px; }
            .calendar-header { font-size: 13px; margin-bottom: 4px; }
            .calendar-week { font-size: 9px; }
            .calendar-days .day { font-size: 12px; padding: 1px 0; }
            .calendar-days .day .dot { width: 3px; height: 3px; }
            .subject-tab { height: 40px; font-size: 14px; padding: 8px 0; }
            .card-module { padding: 6px 8px; }
            .card-module.large { padding-top: 8px; }
            .card-module.large .label { font-size: 13px; }
            .card-module.large .big-number { font-size: 18px; }
            .card-module.large .sub-line { font-size: 10px; }
            .card-module.large .weak-tag { font-size: 10px; padding: 2px 10px; }
            .card-module.small .label { font-size: 12px; }
            .btn-primary { padding: 10px 0; font-size: 14px; margin-top: 6px; }
            .btn-secondary { padding: 8px 0; font-size: 13px; }
            .grid-container { gap: 8px; }
            .grid-row { gap: 8px; }
            .grid-row .col { gap: 8px; }
        }
        @media (max-height: 600px) {
            .calendar-days .day { font-size: 10px; }
            .subject-tab { height: 34px; font-size: 12px; }
            .card-module.large .big-number { font-size: 15px; }
            .card-module.small .label { font-size: 11px; }
            .btn-primary { padding: 8px 0; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== 日历 ===== -->
        <div class="calendar-section" id="calendarSection"></div>

        <!-- ===== 学科切换 ===== -->
        <div class="subject-tabs" id="subjectTabs">
            <button class="subject-tab history-tab active" data-subject="history"><span>历史</span></button>
            <button class="subject-tab politics-tab" data-subject="politics"><span>道法</span></button>
        </div>

        <!-- ===== 两列网格 ===== -->
        <div class="grid-container" id="gridContainer"></div>

        <!-- ===== 底部按钮 ===== -->
        <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
        <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>

    </div>

    <script>
        // ============================================================
        // 1. 日历
        // ============================================================
        (function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();

            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(today - now.getDay());

            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(firstDayOfWeek.getDate() + i);
                weekDates.push(d);
            }

            let usedDays = {};
            try {
                const stored = localStorage.getItem('daofa_used_days');
                if (stored) usedDays = JSON.parse(stored);
            } catch (e) {}
            const todayKey = year + '-' + (month + 1) + '-' + today;
            if (!usedDays[todayKey]) {
                usedDays[todayKey] = true;
                localStorage.setItem('daofa_used_days', JSON.stringify(usedDays));
            }

            const weekAbbr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let html = '';
            html += '<div class="calendar-header">' + year + '.' + (month + 1) + '</div>';
            html += '<div class="calendar-week">';
            for (let i = 0; i < 7; i++) {
                html += '<span>' + weekAbbr[i] + '</span>';
            }
            html += '</div>';
            html += '<div class="calendar-days">';
            for (let i = 0; i < 7; i++) {
                const d = weekDates[i];
                const day = d.getDate();
                const isToday = (day === today && d.getMonth() === month && d.getFullYear() === year);
                const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + day;
                const used = !!usedDays[key];
                let cls = 'day';
                if (isToday) cls += ' today';
                if (used) cls += ' used-date';
                html += '<div class="' + cls + '">' +
                    '<span>' + day + '</span>' +
                    '<span class="dot' + (used ? ' used' : '') + '"></span>' +
                    '</div>';
            }
            html += '</div>';
            document.getElementById('calendarSection').innerHTML = html;
        })();

        // ============================================================
        // 2. 数据
        // ============================================================
        const HISTORY_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 10, total: 30, status: 'done' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 10, total: 30, status: 'active' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };
        const POLITICS_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 5, total: 30, status: 'active' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };

        const colorMap = {
            '七上': 'color-blue', '七下': 'color-blue',
            '八上': 'color-pink', '八下': 'color-pink',
            '九上': 'color-green', '九下': 'color-green'
        };
        const statusMap = {
            'done': { label: '已完成' },
            'active': { label: '进行中' },
            'pending': { label: '未开始' }
        };
        const rightModules = ['七上', '八上', '九上'];
        const leftModules = ['七下', '八下', '九下'];

        // ============================================================
        // 3. 渲染网格
        // ============================================================
        function renderGrid(subject) {
            const container = document.getElementById('gridContainer');
            const data = (subject === 'history') ? HISTORY_STATUS : POLITICS_STATUS;

            let totalDone = 0,
                totalAll = 0;
            for (let key in data) {
                totalDone += data[key].done || 0;
                totalAll += data[key].total || 0;
            }
            const weakModule = '八下 · 法治';

            const leftCol = [];
            const rightCol = [];

            leftCol.push({ type: 'large', name: 'diagnosis', label: '📊 学情诊断', data: { done: totalDone, total: totalAll,
                    weak: weakModule } });
            for (let i = 0; i < leftModules.length; i++) {
                const name = leftModules[i];
                const d = data[name] || { done: 0, total: 0, status: 'pending' };
                leftCol.push({ type: 'small', name: name, data: d });
            }

            for (let i = 0; i < rightModules.length; i++) {
                const name = rightModules[i];
                const d = data[name] || { done: 0, total: 0, status: 'pending' };
                rightCol.push({ type: 'small', name: name, data: d });
            }
            rightCol.push({ type: 'large', name: 'sprint', label: '🎯 中考冲刺', data: { done: totalDone } });

            let leftHtml = '';
            for (let i = 0; i < leftCol.length; i++) {
                const item = leftCol[i];
                if (item.type === 'large') {
                    leftHtml += `
                        <div class="card-module large" data-module="${item.name}">
                            <div class="label">${item.label}</div>
                            <div class="big-number">${item.data.done}<span class="small"> / ${item.data.total || ''} 题</span></div>
                            <div class="sub-line">正确率 68%</div>
                            <div class="weak-tag">📌 薄弱：<strong>${item.data.weak || '八下·法治'}</strong></div>
                        </div>
                    `;
                } else {
                    const d = item.data;
                    const info = statusMap[d.status] || statusMap['pending'];
                    leftHtml += `
                        <div class="card-module small ${colorMap[item.name] || ''}" data-module="${item.name}">
                            <div class="label">${item.name}</div>
                            <div class="sub">${d.done > 0 ? d.done + '/' + d.total + ' 题' : info.label}</div>
                        </div>
                    `;
                }
            }

            let rightHtml = '';
            for (let i = 0; i < rightCol.length; i++) {
                const item = rightCol[i];
                if (item.type === 'large') {
                    rightHtml += `
                        <div class="card-module large" data-module="${item.name}">
                            <div class="label">${item.label}</div>
                            <div class="big-number">${item.data.done}<span class="small"> 题</span></div>
                            <div class="sub-line">综合复习 · 查漏补缺</div>
                        </div>
                    `;
                } else {
                    const d = item.data;
                    const info = statusMap[d.status] || statusMap['pending'];
                    rightHtml += `
                        <div class="card-module small ${colorMap[item.name] || ''}" data-module="${item.name}">
                            <div class="label">${item.name}</div>
                            <div class="sub">${d.done > 0 ? d.done + '/' + d.total + ' 题' : info.label}</div>
                        </div>
                    `;
                }
            }

            container.innerHTML = `
                <div class="grid-row">
                    <div class="col">${leftHtml}</div>
                    <div class="col">${rightHtml}</div>
                </div>
            `;

            container.querySelectorAll('.card-module').forEach(function(el) {
                el.addEventListener('click', function() {
                    const m = this.dataset.module;
                    if (m === 'diagnosis') alert('📊 学情诊断详情即将上线');
                    else if (m === 'sprint') alert('🎯 中考冲刺模块即将上线');
                    else alert('📚 进入 ' + m + ' 刷题（示例功能）');
                });
            });
        }

        // ============================================================
        // 4. 学科切换
        // ============================================================
        document.querySelectorAll('.subject-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.subject-tab').forEach(function(t) {
                    t.classList.remove('active');
                });
                this.classList.add('active');
                renderGrid(this.dataset.subject);
            });
        });

        // ============================================================
        // 5. 初始化
        // ============================================================
        renderGrid('history');

        // ============================================================
        // 6. 底部按钮
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            alert('🚀 诊断功能即将上线，敬请期待！');
        });
        document.getElementById('reportBtn').addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线，敬请期待！');
        });

        console.log('✅ 道法历史 · 闯关（最终质感版）已加载');
    </script>
</body>
</html>
