<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px 30px;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* 顶部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .logo span {
            font-weight: 300;
            color: #c49a6c;
        }

        .user-badge {
            font-size: 13px;
            color: #999;
            background: #f5f5f5;
            border-radius: 30px;
            padding: 6px 16px 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-badge .dot {
            width: 8px;
            height: 8px;
            background: #c49a6c;
            border-radius: 50%;
            display: inline-block;
        }

        /* 卡片 */
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px 0 4px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: #1a1a1a;
            padding: 0 4px 4px;
        }

        .card-sub {
            font-size: 13px;
            color: #999;
            padding: 0 4px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        /* 列表 - 完全按参考图 */
        .path-list {
            display: flex;
            flex-direction: column;
            padding-top: 4px;
        }

        .path-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4px;
            border-bottom: 1px solid #f5f5f5;
        }

        .path-item:last-child {
            border-bottom: none;
        }

        .path-name {
            font-size: 16px;
            font-weight: 400;
            color: #1a1a1a;
        }

        .path-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #999;
        }

        .path-right .count {
            color: #1a1a1a;
            font-weight: 500;
        }

        .path-status {
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 30px;
            background: #f5f5f5;
            color: #bbb;
        }

        .path-status.done {
            background: #f0f7f0;
            color: #5a8a5a;
        }

        .path-status.active {
            background: #f7f0e8;
            color: #c49a6c;
        }

        /* 按钮 */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 16px;
            background: #c49a6c;
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }
        .btn-primary:active {
            background: #b8864a;
        }

        .btn-secondary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 16px;
            background: transparent;
            color: #999;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            border: 1px solid #eee;
        }
        .btn-secondary:active {
            background: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo">道法历史 <span>· 闯关</span></div>
            <div class="user-badge">
                <span class="dot"></span>
                八年级 · 诊断中
            </div>
        </div>

        <!-- 卡片 -->
        <div class="card">
            <div class="card-title">学习路径</div>
            <div class="card-sub">已诊断 0 / 200 题</div>

            <div class="path-list">
                <div class="path-item">
                    <span class="path-name">七上</span>
                    <div class="path-right">
                        <span class="path-status done">已完成</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">七下</span>
                    <div class="path-right">
                        <span class="path-status done">已完成</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">八上</span>
                    <div class="path-right">
                        <span class="count">10</span> 题
                        <span class="path-status done">已完成</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">八下</span>
                    <div class="path-right">
                        <span class="count">10</span> 题
                        <span class="path-status active">进行中</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">九上</span>
                    <div class="path-right">
                        <span class="path-status">未开始</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">九下</span>
                    <div class="path-right">
                        <span class="path-status">未开始</span>
                    </div>
                </div>
                <div class="path-item">
                    <span class="path-name">中考冲刺</span>
                    <div class="path-right">
                        <span class="path-status">未开始</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 按钮 -->
        <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
        <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            alert('🚀 诊断功能即将上线，敬请期待！');
        });
        document.getElementById('reportBtn').addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线，敬请期待！');
        });
    </script>
</body>
</html>
