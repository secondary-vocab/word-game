<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f2eb;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px 16px 40px;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* ===== 顶部：日期 ===== */
        .date-bar {
            font-size: 14px;
            color: #8a7a6a;
            padding-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .date-bar span {
            font-weight: 500;
            color: #2c241c;
        }

        /* ===== 标题区 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
        }
        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #2c241c;
        }
        .logo span {
            font-weight: 300;
            color: #c49a6c;
        }
        .user-badge {
            font-size: 13px;
            color: #8a7a6a;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            padding: 6px 16px 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(196, 154, 108, 0.15);
        }
        .user-badge .dot {
            width: 8px;
            height: 8px;
            background: #c49a6c;
            border-radius: 50%;
            display: inline-block;
        }

        /* ===== 学科切换 ===== */
        .subject-tabs {
            display: flex;
            gap: 12px;
            padding-bottom: 18px;
        }
        .subject-tab {
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            color: #8a7a6a;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(196, 154, 108, 0.1);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            flex: 1;
        }
        .subject-tab.active {
            background: #c49a6c;
            color: #fff;
            border-color: #c49a6c;
            box-shadow: 0 2px 12px rgba(196, 154, 108, 0.25);
        }
        .subject-tab:active {
            transform: scale(0.96);
        }

        /* ===== 学情诊断卡 ===== */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px 20px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 16px rgba(180, 150, 120, 0.06);
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 4px;
        }
        .card-sub {
            font-size: 13px;
            color: #8a7a6a;
            margin-bottom: 6px;
        }
        .diagnosis-stats {
            display: flex;
            gap: 24px;
            padding-top: 4px;
        }
        .diagnosis-stats .stat-item {
            display: flex;
            flex-direction: column;
        }
        .diagnosis-stats .stat-number {
            font-size: 22px;
            font-weight: 600;
            color: #2c241c;
        }
        .diagnosis-stats .stat-number .small {
            font-size: 14px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .diagnosis-stats .stat-label {
            font-size: 12px;
            color: #8a7a6a;
        }
        .weak-tag {
            margin-top: 10px;
            font-size: 13px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
        }
        .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        /* ===== 模块列表 ===== */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 4px 0;
        }
        .module-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.15s;
        }
        .module-item.active {
            background: rgba(196, 154, 108, 0.06);
            border-color: rgba(196, 154, 108, 0.15);
        }
        .module-name {
            font-size: 16px;
            font-weight: 400;
            color: #2c241c;
        }
        .module-status {
            font-size: 12px;
            padding: 2px 14px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.04);
            color: #bbb;
        }
        .module-status.done {
            background: rgba(196, 154, 108, 0.08);
            color: #c49a6c;
        }
        .module-status.active {
            background: rgba(196, 154, 108, 0.12);
            color: #b8864a;
        }
        .module-status .count {
            color: #2c241c;
            font-weight: 500;
        }

        /* ===== 按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 18px;
            background: #c49a6c;
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 16px rgba(196, 154, 108, 0.2);
            margin-top: 8px;
        }
        .btn-primary:active {
            background: #b8864a;
            transform: scale(0.97);
        }

        .btn-secondary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 18px;
            background: transparent;
            color: #8a7a6a;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            border: 1px solid rgba(196, 154, 108, 0.12);
            transition: background 0.15s;
        }
        .btn-secondary:active {
            background: rgba(196, 154, 108, 0.04);
        }

        /* ===== 模块内容切换（默认历史） ===== */
        .module-content {
            display: block;
        }
        .module-content.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== 顶部：日期 ===== -->
        <div class="date-bar" id="dateDisplay"></div>

        <!-- ===== 标题区 ===== -->
        <div class="header">
            <div class="logo">道法历史 <span>· 闯关</span></div>
            <div class="user-badge">
                <span class="dot"></span>
                八年级 · 诊断中
            </div>
        </div>

        <!-- ===== 学科切换 ===== -->
        <div class="subject-tabs" id="subjectTabs">
            <div class="subject-tab active" data-subject="history">历史</div>
            <div class="subject-tab" data-subject="politics">道法</div>
        </div>

        <!-- ===== 学情诊断卡 ===== -->
        <div class="card">
            <div class="card-title">学情诊断</div>
            <div class="card-sub">已诊断 <strong id="totalDone">0</strong> / 200 题</div>
            <div class="diagnosis-stats">
                <div class="stat-item">
                    <span class="stat-number" id="accuracyDisplay">0<span class="small">%</span></span>
                    <span class="stat-label">正确率</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="weakCount">0</span>
                    <span class="stat-label">薄弱知识点</span>
                </div>
            </div>
            <div class="weak-tag">📌 当前薄弱：<strong id="weakModule">八下 · 法治</strong></div>
        </div>

        <!-- ===== 历史模块列表 ===== -->
        <div class="module-content" id="historyModules">
            <div class="module-list" id="historyList">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <!-- ===== 道法模块列表 ===== -->
        <div class="module-content hidden" id="politicsModules">
            <div class="module-list" id="politicsList">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <!-- ===== 按钮 ===== -->
        <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
        <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>

    </div>

    <script>
        // ============================================================
        // 1. 显示当前日期
        // ============================================================
        (function showDate() {
            const now = new Date();
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const wd = weekdays[now.getDay()];
            document.getElementById('dateDisplay').innerHTML =
                '📅 <span>' + month + '月' + day + '日</span> · 周' + wd;
        })();

        // ============================================================
        // 2. 模块数据
        // ============================================================
        const MODULES = ['七上', '七下', '八上', '八下', '九上', '九下', '中考冲刺'];

        // 模拟状态：每个模块的完成题数，-1 表示未开始
        // 实际使用时替换为真实数据
        const HISTORY_STATUS = {
            '七上': { done: 0, total: 30, status: 'done' },
            '七下': { done: 0, total: 30, status: 'done' },
            '八上': { done: 10, total: 30, status: 'done' },
            '八下': { done: 10, total: 30, status: 'active' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' },
            '中考冲刺': { done: 0, total: 30, status: 'pending' }
        };
        const POLITICS_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 5, total: 30, status: 'active' },
            '八下': { done: 0, total: 30, status: 'pending' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' },
            '中考冲刺': { done: 0, total: 30, status: 'pending' }
        };

        // ============================================================
        // 3. 渲染模块列表
        // ============================================================
        function renderModules(containerId, statusData) {
            const container = document.getElementById(containerId);
            let html = '';
            MODULES.forEach(function(name) {
                const data = statusData[name] || { done: 0, total: 0, status: 'pending' };
                const statusMap = {
                    'done': { label: '已完成', cls: 'done' },
                    'active': { label: '进行中', cls: 'active' },
                    'pending': { label: '未开始', cls: '' }
                };
                const info = statusMap[data.status] || statusMap['pending'];
                const isActive = (data.status === 'active');
                let rightHtml = '<span class="module-status ' + info.cls + '">';
                if (data.done > 0) {
                    rightHtml += '<span class="count">' + data.done + '</span> 题 · ';
                }
                rightHtml += info.label + '</span>';
                html += '<div class="module-item' + (isActive ? ' active' : '') + '">' +
                    '<span class="module-name">' + name + '</span>' +
                    '<div class="module-right">' + rightHtml + '</div>' +
                    '</div>';
            });
            container.innerHTML = html;
        }

        renderModules('historyList', HISTORY_STATUS);
        renderModules('politicsList', POLITICS_STATUS);

        // ============================================================
        // 4. 学情诊断数据（模拟，实际使用时替换）
        // ============================================================
        // 目前只显示历史的进度，后续可合并两科
        let totalDone = 20;
        let totalAll = 200;
        let accuracy = 68;
        let weakModule = '八下 · 法治';

        document.getElementById('totalDone').textContent = totalDone;
        document.getElementById('accuracyDisplay').innerHTML = accuracy + '<span class="small">%</span>';
        document.getElementById('weakModule').textContent = weakModule;
        // 薄弱知识点数量暂定
        document.getElementById('weakCount').textContent = '3';

        // ============================================================
        // 5. 学科切换
        // ============================================================
        var tabs = document.querySelectorAll('.subject-tab');
        var historyContent = document.getElementById('historyModules');
        var politicsContent = document.getElementById('politicsModules');

        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                // 切换高亮
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');

                var subject = this.dataset.subject;
                if (subject === 'history') {
                    historyContent.classList.remove('hidden');
                    politicsContent.classList.add('hidden');
                } else {
                    historyContent.classList.add('hidden');
                    politicsContent.classList.remove('hidden');
                }
            });
        });

        // ============================================================
        // 6. 按钮事件
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            alert('🚀 诊断功能即将上线，敬请期待！');
        });
        document.getElementById('reportBtn').addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线，敬请期待！');
        });

        console.log('✅ 道法历史 · 闯关（暖米白 · 完整版）已加载');
    </script>
</body>
</html>
