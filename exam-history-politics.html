<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: #ffffff;
            padding: 4px 8px 6px 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
            margin-bottom: 6px;
            text-align: left;
            letter-spacing: 0.3px;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 9px;
            color: #8a7a6a;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 13px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
            font-weight: 400;
        }
        .calendar-days .day .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 500;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 品牌区（报纸背景图） ===== */
        .brand-section {
            border-radius: 14px;
            padding: 0;
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            height: 80px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e0d8;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100"><rect width="400" height="100" fill="%23f5f0e8"/><text x="20" y="35" font-family="serif" font-size="18" fill="%23b8864a" opacity="0.3">历史·道法</text><text x="20" y="60" font-family="serif" font-size="12" fill="%238a7a6a" opacity="0.25">闯关 · 2026</text><line x1="20" y1="70" x2="120" y2="70" stroke="%23dcd3cb" stroke-width="1" opacity="0.3"/></svg>');
            background-size: cover;
            background-position: center;
            background-color: #f5f0e8;
        }
        .brand-top {
            flex: 1;
            padding: 12px 18px 6px 18px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
        }
        .brand-text {
            font-size: 20px;
            font-weight: 400;
            color: #2c241c;
            letter-spacing: 2px;
        }
        .brand-text .history {
            color: #b8864a;
        }
        .brand-text .politics {
            color: #4a6a8a;
        }
        .brand-sub {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 300;
            letter-spacing: 1px;
            padding-top: 2px;
        }
        .brand-bottom {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0 18px 10px 18px;
            z-index: 1;
        }
        .brand-bottom::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(0deg, rgba(0, 0, 0, 0.02) 0px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 0px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 0;
        }
        .brand-number {
            font-size: 18px;
            font-weight: 300;
            color: #8a7a6a;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 14px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
        .brand-number strong {
            font-weight: 500;
            color: #b8864a;
        }

        /* ===== 首页网格 ===== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            min-height: 0;
            overflow: hidden;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }

        .card-module.large {
            grid-row: span 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #f0ecf5;
            border-color: #e8e0d8;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 400;
            color: #b8a48a;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
            font-weight: 400;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        .card-module.small {
            padding: 8px 12px;
        }
        .card-module.small .label {
            font-size: 14px;
            font-weight: 400;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
        }

        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #b8a48a;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(184, 164, 138, 0.20);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .btn-primary:active {
            background: #a08c74;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ============================================================
           第2页
           ============================================================ */
        .page-secondary {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            padding: 12px 16px 20px;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }
        .page-secondary.show {
            display: flex;
        }
        .page-secondary-inner {
            max-width: 420px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-secondary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 4px 0;
            flex-shrink: 0;
        }
        .page-secondary-header .back {
            font-size: 32px;
            font-weight: 700;
            color: #4a6a8a;
            cursor: pointer;
            padding: 0 8px 0 0;
            background: none;
            border: none;
            line-height: 0.8;
            letter-spacing: -4px;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            display: inline-block;
        }
        .page-secondary-header .back:active {
            opacity: 0.6;
        }
        .page-secondary-header .placeholder {
            width: 40px;
        }

        .subject-cards-row {
            display: flex;
            gap: 32px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .subject-card {
            flex: 1;
            padding: 12px 16px 10px 16px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: none;
            position: relative;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .subject-card:active {
            transform: scale(0.96);
        }
        .subject-card.active {
            box-shadow: 0 4px 20px rgba(196, 154, 108, 0.12);
        }
        .subject-card[data-subject="history"] {
            background: #faf6f0;
        }
        .subject-card[data-subject="politics"] {
            background: #f0f4f8;
        }
        .subject-card .icon {
            font-size: 20px;
            margin-right: 6px;
        }
        .subject-card .name-wrap {
            display: flex;
            align-items: center;
        }
        .subject-card .name {
            font-size: 22px;
            font-weight: 600;
            color: #2c241c;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .subject-card .progress {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 400;
            text-align: right;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .subject-card .progress .num {
            font-weight: 500;
            color: #c49a6c;
        }

        .plan-title {
            font-size: 20px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 2px;
            flex-shrink: 0;
            padding-top: 2px;
            letter-spacing: 0.5px;
        }

        .module-label {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
            margin-bottom: 10px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-top: 2px;
            min-height: 0;
        }
        .unit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-radius: 12px;
            background: #faf8f6;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            flex: 0 0 auto;
            min-height: 48px;
        }
        .unit-item:active {
            background: #f0ede8;
        }
        .unit-item .name {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }
        .unit-item .name .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .unit-item .name .dot.done {
            background: #c49a6c;
        }
        .unit-item .name .dot.active {
            background: #b8864a;
        }
        .unit-item .name .dot.pending {
            background: #dcd3cb;
        }
        .unit-item .progress {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 400;
        }
        .unit-item .progress .done {
            color: #c49a6c;
            font-weight: 500;
        }

        .unit-item.summary {
            background: #f0ece6;
            border: 1px solid #e8e0d8;
        }
        .unit-item.summary .name {
            font-weight: 500;
        }

        /* ===== 学习成果模块 ===== */
        .result-section {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid #f0ede8;
            margin-top: 8px;
            padding-bottom: 16px;
        }
        .result-title {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
        }
        .result-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8a7a6a;
        }
        .result-row .unit-name {
            font-size: 11px;
            color: #8a7a6a;
            flex-shrink: 0;
            min-width: 32px;
        }
        .result-row .bar-wrap {
            flex: 1;
            height: 5px;
            background: #f0ede8;
            border-radius: 4px;
            overflow: hidden;
        }
        .result-row .bar-wrap .bar {
            height: 100%;
            border-radius: 4px;
            background: #c49a6c;
            transition: width 0.3s;
        }
        .result-row .percent {
            font-size: 11px;
            color: #b8a48a;
            flex-shrink: 0;
            min-width: 28px;
            text-align: right;
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section { padding: 2px 6px 4px 6px; margin-bottom: 6px; }
            .calendar-header { font-size: 12px; margin-bottom: 4px; }
            .calendar-week { font-size: 8px; }
            .calendar-days .day { font-size: 11px; padding: 1px 0; }
            .calendar-days .day .dot { width: 2px; height: 2px; }
            .brand-section { height: 60px; margin-bottom: 8px; }
            .brand-top { padding: 6px 12px 4px 12px; }
            .brand-text { font-size: 16px; }
            .brand-sub { font-size: 10px; }
            .brand-bottom { padding: 0 12px 6px 12px; }
            .brand-number { font-size: 14px; padding: 2px 10px; }
            .card-module { padding: 4px 8px; }
            .card-module.large { padding-top: 6px; }
            .card-module.large .label { font-size: 12px; }
            .card-module.large .big-number { font-size: 16px; }
            .card-module.large .sub-line { font-size: 10px; }
            .card-module.large .weak-tag { font-size: 10px; padding: 2px 8px; }
            .card-module.small .label { font-size: 11px; }
            .btn-primary { padding: 8px 0; font-size: 13px; margin-top: 4px; }
            .btn-secondary { padding: 6px 0; font-size: 12px; }
            .grid-container { gap: 6px; }
            .page-secondary-header .back { font-size: 24px; }
            .subject-card .name { font-size: 18px; }
            .subject-card .progress { font-size: 11px; }
            .subject-card { padding: 8px 12px 6px 12px; min-height: 52px; }
            .plan-title { font-size: 16px; }
            .module-label { font-size: 11px; margin-bottom: 8px; }
            .unit-item { padding: 8px 14px; min-height: 40px; }
            .unit-item .name { font-size: 13px; }
            .unit-item .progress { font-size: 11px; }
            .unit-list { gap: 6px; }
            .subject-cards-row { gap: 20px; margin-bottom: 10px; }
            .result-section { padding-top: 12px; padding-bottom: 10px; }
            .result-title { font-size: 13px; }
            .result-row { font-size: 11px; }
            .result-row .bar-wrap { height: 4px; }
        }
        @media (max-height: 600px) {
            .calendar-days .day { font-size: 10px; }
            .brand-section { height: 50px; }
            .brand-top { padding: 4px 10px 2px 10px; }
            .brand-text { font-size: 14px; }
            .brand-sub { font-size: 9px; }
            .brand-bottom { padding: 0 10px 4px 10px; }
            .brand-number { font-size: 12px; padding: 2px 8px; }
            .card-module.large .big-number { font-size: 14px; }
            .card-module.small .label { font-size: 10px; }
            .btn-primary { padding: 6px 0; font-size: 12px; }
            .page-secondary-header .back { font-size: 20px; }
            .subject-card .name { font-size: 15px; }
            .subject-card .progress { font-size: 10px; }
            .subject-card { padding: 6px 10px 4px 10px; min-height: 44px; }
            .plan-title { font-size: 14px; }
            .module-label { font-size: 10px; margin-bottom: 6px; }
            .unit-item { padding: 6px 12px; min-height: 34px; }
            .unit-item .name { font-size: 12px; }
            .unit-list { gap: 4px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- 首页 -->
    <div id="page-main" style="display:flex; flex-direction:column; height:100%;">
        <!-- 日历 -->
        <div class="calendar-section">
            <div class="calendar-header" id="calendarHeader">2026年8月</div>
            <div class="calendar-week">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
        </div>

        <!-- 品牌区 -->
        <div class="brand-section">
            <div class="brand-top">
                <div>
                    <div class="brand-text"><span class="history">历史</span> · <span class="politics">道法</span></div>
                    <div class="brand-sub">闯关 · 2026</div>
                </div>
                <div style="text-align:right; padding-top:2px;">
                    <div style="font-size:12px; color:#8a7a6a;">第</div>
                    <div style="font-size:18px; font-weight:300; color:#b8864a; line-height:1;">12</div>
                    <div style="font-size:10px; color:#8a7a6a;">周</div>
                </div>
            </div>
            <div class="brand-bottom">
                <div class="brand-number"><strong>8</strong> 月 · 闯关 <strong>4</strong></div>
            </div>
        </div>

        <!-- 网格 -->
        <div class="grid-container">
            <div class="card-module large" data-target="history">
                <div class="label">📜 历史</div>
                <div class="big-number">6 <span class="small">/ 8</span></div>
                <div class="sub-line">已闯 · 古代史</div>
                <div class="weak-tag">⏳ 本周 <strong>2</strong> 关</div>
            </div>
            <div class="card-module large" data-target="politics">
                <div class="label">⚖️ 道法</div>
                <div class="big-number">4 <span class="small">/ 6</span></div>
                <div class="sub-line">已闯 · 法治篇</div>
                <div class="weak-tag">📌 进行中 <strong>1</strong></div>
            </div>
            <div class="card-module small color-blue">
                <div class="label">📖 今日计划</div>
                <div class="sub">历史·秦统一</div>
            </div>
            <div class="card-module small color-pink">
                <div class="label">⭐ 收藏</div>
                <div class="sub">3 个重点</div>
            </div>
            <div class="card-module small color-green">
                <div class="label">🏆 成就</div>
                <div class="sub">青铜 · 史官</div>
            </div>
            <div class="card-module small">
                <div class="label">📊 统计</div>
                <div class="sub">本月 12 关</div>
            </div>
        </div>

        <button class="btn-primary" id="enterSecondaryBtn">进入闯关 · 详情</button>
        <button class="btn-secondary" id="resetBtn">重置进度</button>
    </div>

    <!-- 第二页 -->
    <div class="page-secondary" id="pageSecondary">
        <div class="page-secondary-inner">
            <div class="page-secondary-header">
                <button class="back" id="backBtn">‹</button>
                <span style="font-size:18px; font-weight:400; color:#2c241c; letter-spacing:1px;">闯关 · 单元</span>
                <span class="placeholder"></span>
            </div>

            <div class="subject-cards-row">
                <div class="subject-card active" data-subject="history" id="subjectHistory">
                    <div class="name-wrap"><span class="icon">📜</span><span class="name">历史</span></div>
                    <div class="progress">进度 <span class="num">6/8</span></div>
                </div>
                <div class="subject-card" data-subject="politics" id="subjectPolitics">
                    <div class="name-wrap"><span class="icon">⚖️</span><span class="name">道法</span></div>
                    <div class="progress">进度 <span class="num">4/6</span></div>
                </div>
            </div>

            <div class="plan-title">📚 单元闯关</div>
            <div class="module-label" id="moduleLabel">历史 · 古代史</div>

            <div class="unit-list" id="unitList">
                <!-- 动态渲染 -->
            </div>

            <div class="result-section">
                <div class="result-title">📈 学习成果</div>
                <div class="result-grid" id="resultGrid">
                    <div class="result-row"><span class="unit-name">先秦</span><div class="bar-wrap"><div class="bar" style="width:80%"></div></div><span class="percent">80%</span></div>
                    <div class="result-row"><span class="unit-name">秦汉</span><div class="bar-wrap"><div class="bar" style="width:60%"></div></div><span class="percent">60%</span></div>
                    <div class="result-row"><span class="unit-name">法治</span><div class="bar-wrap"><div class="bar" style="width:40%"></div></div><span class="percent">40%</span></div>
                    <div class="result-row"><span class="unit-name">宪法</span><div class="bar-wrap"><div class="bar" style="width:20%"></div></div><span class="percent">20%</span></div>
                </div>
            </div>

            <button class="btn-primary" id="closeSecondaryBtn" style="margin-top:6px;">返回首页</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 日历 ----------
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();

        function renderCalendar() {
            const header = document.getElementById('calendarHeader');
            const daysEl = document.getElementById('calendarDays');
            const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
            header.textContent = year + '年' + monthNames[month];

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev = new Date(year, month, 0).getDate();

            let html = '';
            // 上月填充
            for (let i = firstDay - 1; i >= 0; i--) {
                const d = daysInPrev - i;
                html += `<div class="day other-month">${d}</div>`;
            }
            // 本月
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (d === today);
                const used = (d % 3 === 0) || (d === 8 || d === 15 || d === 22); // 模拟已用日期
                const dotClass = used ? 'dot used' : 'dot';
                const todayClass = isToday ? 'today' : '';
                const usedClass = used ? 'used-date' : '';
                html += `<div class="day ${todayClass} ${usedClass}">${d}<span class="${dotClass}"></span></div>`;
            }
            // 下月填充
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - totalCells % 7) % 7;
            for (let d = 1; d <= remaining; d++) {
                html += `<div class="day other-month">${d}</div>`;
            }
            daysEl.innerHTML = html;
        }
        renderCalendar();

        // ---------- 数据 ----------
        const data = {
            history: {
                name: '历史',
                units: [
                    { id: 'h1', name: '先秦 · 夏商周', done: true },
                    { id: 'h2', name: '春秋战国', done: true },
                    { id: 'h3', name: '秦统一', done: true },
                    { id: 'h4', name: '两汉', done: true },
                    { id: 'h5', name: '三国两晋', done: false },
                    { id: 'h6', name: '南北朝', done: false },
                    { id: 'h7', name: '隋唐', done: false },
                    { id: 'h8', name: '宋元', done: false },
                ],
                doneCount: 4 // 手动控制
            },
            politics: {
                name: '道法',
                units: [
                    { id: 'p1', name: '法治精神', done: true },
                    { id: 'p2', name: '宪法基础', done: true },
                    { id: 'p3', name: '公民权利', done: true },
                    { id: 'p4', name: '国家机构', done: false },
                    { id: 'p5', name: '法治实践', done: false },
                    { id: 'p6', name: '国际法', done: false },
                ],
                doneCount: 3
            }
        };
        // 根据 done 重新计算 doneCount
        function recalcDone(subject) {
            const units = data[subject].units;
            let count = 0;
            units.forEach(u => { if (u.done) count++; });
            data[subject].doneCount = count;
        }
        recalcDone('history');
        recalcDone('politics');

        let currentSubject = 'history';

        // ---------- 渲染单元列表 ----------
        function renderUnits(subjectKey) {
            const list = document.getElementById('unitList');
            const subject = data[subjectKey];
            const units = subject.units;
            const total = units.length;
            const done = subject.doneCount;
            const label = document.getElementById('moduleLabel');
            const subName = subjectKey === 'history' ? '历史 · 古代史' : '道法 · 法治篇';
            label.textContent = subName;

            // 更新 subject card 高亮
            document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.subject-card[data-subject="${subjectKey}"]`);
            if (card) card.classList.add('active');
            // 更新进度数字
            document.querySelectorAll('.subject-card .progress .num').forEach(el => {
                const parent = el.closest('.subject-card');
                if (!parent) return;
                const key = parent.dataset.subject;
                if (key === subjectKey) {
                    el.textContent = `${done}/${total}`;
                }
            });

            let html = '';
            units.forEach((unit, index) => {
                const status = unit.done ? 'done' : (index === 0 ? 'active' : 'pending');
                const dotClass = `dot ${status}`;
                const doneText = unit.done ? `${Math.floor(Math.random() * 30 + 70)}%` : '未完成';
                html += `
                    <div class="unit-item" data-id="${unit.id}" data-done="${unit.done}">
                        <div class="name"><span class="${dotClass}"></span> ${unit.name}</div>
                        <div class="progress">${unit.done ? '<span class="done">✓ 完成</span>' : '⏳ 进行中'}</div>
                    </div>
                `;
            });

            // 汇总行
            const progressPercent = Math.round((done / total) * 100);
            html += `
                <div class="unit-item summary">
                    <div class="name">📊 汇总</div>
                    <div class="progress">已完成 <span class="done">${done}</span> / ${total} · ${progressPercent}%</div>
                </div>
            `;
            list.innerHTML = html;

            // 绑定点击事件：切换 done 状态
            list.querySelectorAll('.unit-item[data-id]').forEach(el => {
                el.addEventListener('click', function(e) {
                    const id = this.dataset.id;
                    const subjectData = data[currentSubject];
                    const unit = subjectData.units.find(u => u.id === id);
                    if (unit) {
                        unit.done = !unit.done;
                        recalcDone(currentSubject);
                        renderUnits(currentSubject);
                        updateMainPageStats();
                    }
                });
            });

            // 更新首页大卡
            updateMainPageStats();
        }

        // 更新首页大卡数据
        function updateMainPageStats() {
            const hist = data.history;
            const poli = data.politics;
            const histTotal = hist.units.length;
            const poliTotal = poli.units.length;
            document.querySelector('.card-module.large .big-number') // 历史
                .innerHTML = `${hist.doneCount} <span class="small">/ ${histTotal}</span>`;
            // 道法
            const allBig = document.querySelectorAll('.card-module.large .big-number');
            if (allBig.length >= 2) {
                allBig[1].innerHTML = `${poli.doneCount} <span class="small">/ ${poliTotal}</span>`;
            }
            // 更新子文本
            const subLines = document.querySelectorAll('.card-module.large .sub-line');
            if (subLines.length >= 2) {
                subLines[0].textContent = '已闯 · 古代史';
                subLines[1].textContent = '已闯 · 法治篇';
            }
            // 更新weak-tag
            const weaks = document.querySelectorAll('.card-module.large .weak-tag');
            if (weaks.length >= 2) {
                const histRemain = histTotal - hist.doneCount;
                const poliRemain = poliTotal - poli.doneCount;
                weaks[0].innerHTML = `⏳ 剩余 <strong>${histRemain}</strong> 关`;
                weaks[1].innerHTML = `📌 剩余 <strong>${poliRemain}</strong> 关`;
            }
        }

        // ---------- 切换学科 ----------
        function switchSubject(subjectKey) {
            currentSubject = subjectKey;
            renderUnits(subjectKey);
        }

        // ---------- 页面切换 ----------
        const mainPage = document.getElementById('page-main');
        const secondaryPage = document.getElementById('pageSecondary');

        function showSecondary() {
            secondaryPage.classList.add('show');
            mainPage.style.display = 'none';
            renderUnits(currentSubject);
        }

        function showMain() {
            secondaryPage.classList.remove('show');
            mainPage.style.display = 'flex';
            renderCalendar();
            updateMainPageStats();
        }

        // ---------- 事件绑定 ----------
        document.getElementById('enterSecondaryBtn').addEventListener('click', showSecondary);
        document.getElementById('closeSecondaryBtn').addEventListener('click', showMain);
        document.getElementById('backBtn').addEventListener('click', showMain);

        // 首页大卡点击跳转到对应学科
        document.querySelectorAll('.card-module.large').forEach(card => {
            card.addEventListener('click', function() {
                const target = this.dataset.target;
                if (target === 'history' || target === 'politics') {
                    currentSubject = target;
                    showSecondary();
                }
            });
        });

        // 学科卡片点击切换
        document.getElementById('subjectHistory').addEventListener('click', function() {
            switchSubject('history');
        });
        document.getElementById('subjectPolitics').addEventListener('click', function() {
            switchSubject('politics');
        });

        // 重置进度
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('重置所有进度？')) {
                data.history.units.forEach(u => u.done = false);
                data.politics.units.forEach(u => u.done = false);
                recalcDone('history');
                recalcDone('politics');
                renderUnits(currentSubject);
                updateMainPageStats();
            }
        });

        // 首页直接点“道法/历史”大卡也可以
        // 已经绑定

        // 初始化
        renderUnits('history');
        updateMainPageStats();
        // 默认显示首页
        showMain();

        // 模拟点击历史大卡跳转（让首页大卡可以点）
        // 已经通过 .card-module.large 绑定

        // 额外：点击道法大卡也可以
        // 已经包含

        // 确保品牌区数字动态
        // 已在更新中

        // 成果条也模拟一下
        // 固定展示
    })();
</script>
</body>
</html>
