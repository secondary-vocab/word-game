<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历（本周） ===== */
        .calendar-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 8px 6px 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 15px;
            font-weight: 600;
            color: #2c241c;
            margin-bottom: 6px;
            text-align: left;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            color: #8a7a6a;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 14px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
        }
        .calendar-days .day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 600;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 品牌区（首页） ===== */
        .brand-section {
            border-radius: 14px;
            padding: 20px 18px;
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a2e;
        }
        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg,
                    #4a2c1a 0%, #4a2c1a 4%,
                    #3a2a1a 4%, #3a2a1a 8%,
                    #5a3a2a 8%, #5a3a2a 12%,
                    #2a3a4a 12%, #2a3a4a 16%,
                    #4a3a2a 16%, #4a3a2a 20%,
                    #3a2a3a 20%, #3a2a3a 24%,
                    #5a4a3a 24%, #5a4a3a 28%,
                    #2a4a3a 28%, #2a4a3a 32%,
                    #3a3a4a 32%, #3a3a4a 36%,
                    #4a2a2a 36%, #4a2a2a 40%,
                    #2a2a3a 40%, #2a2a3a 44%,
                    #3a4a2a 44%, #3a4a2a 48%,
                    #4a3a2a 48%, #4a3a2a 52%,
                    #3a2a4a 52%, #3a2a4a 56%,
                    #2a3a4a 56%, #2a3a4a 60%,
                    #4a2a3a 60%, #4a2a3a 64%,
                    #3a4a3a 64%, #3a4a3a 68%,
                    #2a2a2a 68%, #2a2a2a 72%,
                    #4a3a3a 72%, #4a3a3a 76%,
                    #3a2a2a 76%, #3a2a2a 80%,
                    #2a3a3a 80%, #2a3a3a 84%,
                    #4a4a2a 84%, #4a4a2a 88%,
                    #3a3a2a 88%, #3a3a2a 92%,
                    #2a4a4a 92%, #2a4a4a 96%,
                    #4a2a4a 96%, #4a2a4a 100%
                );
            opacity: 0.3;
            filter: blur(6px);
            pointer-events: none;
            z-index: 0;
        }
        .brand-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.1) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .brand-text {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }
        .brand-text .history {
            color: #f5d6b8;
        }
        .brand-text .politics {
            color: #b8d4f5;
        }
        .brand-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        /* ===== 首页网格 ===== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            min-height: 0;
            overflow: hidden;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }

        .card-module.large {
            grid-row: span 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #faf8f6;
            border-color: #e8e0d8;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 700;
            color: #c49a6c;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        .card-module.small {
            padding: 8px 12px;
        }
        .card-module.small .label {
            font-size: 14px;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
        }

        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #5a6a7a;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(90, 106, 122, 0.25);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn-primary:active {
            background: #3d4d5d;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ============================================================
           第2页
           ============================================================ */
        .page-secondary {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            padding: 12px 16px 20px;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }
        .page-secondary.show {
            display: flex;
        }
        .page-secondary-inner {
            max-width: 420px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 返回箭头 - 粗短粗短 */
        .page-secondary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 4px 0;
            flex-shrink: 0;
        }
        .page-secondary-header .back {
            font-size: 32px;
            font-weight: 900;
            color: #4a6a8a;
            cursor: pointer;
            padding: 0 8px 0 0;
            background: none;
            border: none;
            line-height: 0.8;
            letter-spacing: -4px;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            display: inline-block;
        }
        .page-secondary-header .back:active {
            opacity: 0.6;
        }
        .page-secondary-header .placeholder {
            width: 40px;
        }

        /* 历史/道法 两个独立卡片 */
        .subject-cards-row {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .subject-card {
            flex: 1;
            padding: 14px 0 10px 0;
            border-radius: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #f0f0f0;
            background: #faf8f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .subject-card:active {
            transform: scale(0.96);
        }
        .subject-card.active {
            border-color: #c49a6c;
            box-shadow: 0 4px 16px rgba(196, 154, 108, 0.10);
        }
        .subject-card[data-subject="history"] {
            background: #faf6f0;
        }
        .subject-card[data-subject="politics"] {
            background: #f0f4f8;
        }
        .subject-card .name {
            font-size: 20px;
            font-weight: 600;
            color: #2c241c;
        }
        .subject-card .progress {
            font-size: 14px;
            color: #8a7a6a;
            margin-top: 4px;
        }
        .subject-card .progress .num {
            font-weight: 700;
            color: #c49a6c;
        }

        /* 学习计划 - 留白加大 */
        .plan-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c241c;
            margin-bottom: 2px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* 七上 - 小字，无底色，靠下 */
        .module-label {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
            margin-bottom: 12px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        /* 单元列表 */
        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }
        .unit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-radius: 12px;
            background: #faf8f6;
            border: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .unit-item:active {
            background: #f0ede8;
        }
        .unit-item .name {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .unit-item .name .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .unit-item .name .dot.done {
            background: #c49a6c;
        }
        .unit-item .name .dot.active {
            background: #b8864a;
        }
        .unit-item .name .dot.pending {
            background: #dcd3cb;
        }
        .unit-item .progress {
            font-size: 13px;
            color: #8a7a6a;
        }
        .unit-item .progress .done {
            color: #c49a6c;
            font-weight: 600;
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section { padding: 4px 6px 4px 6px; margin-bottom: 6px; }
            .calendar-header { font-size: 13px; margin-bottom: 4px; }
            .calendar-week { font-size: 9px; }
            .calendar-days .day { font-size: 12px; padding: 1px 0; }
            .calendar-days .day .dot { width: 3px; height: 3px; }
            .brand-section { height: 56px; padding: 14px 14px; margin-bottom: 10px; }
            .brand-text { font-size: 18px; }
            .brand-sub { font-size: 10px; }
            .card-module { padding: 6px 8px; }
            .card-module.large { padding-top: 8px; }
            .card-module.large .label { font-size: 13px; }
            .card-module.large .big-number { font-size: 18px; }
            .card-module.large .sub-line { font-size: 10px; }
            .card-module.large .weak-tag { font-size: 10px; padding: 2px 10px; }
            .card-module.small .label { font-size: 12px; }
            .btn-primary { padding: 10px 0; font-size: 14px; margin-top: 6px; }
            .btn-secondary { padding: 8px 0; font-size: 13px; }
            .grid-container { gap: 8px; }
            .page-secondary-header .back { font-size: 28px; }
            .subject-card .name { font-size: 17px; }
            .subject-card .progress { font-size: 12px; }
            .plan-title { font-size: 17px; }
            .module-label { font-size: 12px; }
            .unit-item { padding: 10px 14px; }
            .unit-item .name { font-size: 13px; }
            .unit-item .progress { font-size: 12px; }
            .subject-card { padding: 10px 0 6px 0; }
        }
        @media (max-height: 600px) {
            .calendar-days .day { font-size: 10px; }
            .brand-section { height: 46px; padding: 10px 12px; }
            .brand-text { font-size: 15px; }
            .brand-sub { font-size: 9px; }
            .card-module.large .big-number { font-size: 15px; }
            .card-module.small .label { font-size: 11px; }
            .btn-primary { padding: 8px 0; font-size: 13px; }
            .page-secondary-header .back { font-size: 24px; }
            .subject-card .name { font-size: 15px; }
            .subject-card .progress { font-size: 11px; }
            .plan-title { font-size: 15px; }
            .module-label { font-size: 11px; }
            .unit-item { padding: 8px 12px; }
            .unit-item .name { font-size: 12px; }
            .subject-card { padding: 6px 0 4px 0; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <!-- ===== 首页 ===== -->
        <div id="homePage">
            <div class="calendar-section" id="calendarSection"></div>
            <div class="brand-section">
                <div class="brand-text">
                    <span class="history">历史</span> · <span class="politics">道法</span>
                </div>
                <div class="brand-sub">✦ 双科闯关</div>
            </div>
            <div class="grid-container" id="gridContainer"></div>
            <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
            <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>
        </div>

        <!-- ===== 第2页 ===== -->
        <div class="page-secondary" id="pageSecondary">
            <div class="page-secondary-inner">

                <!-- 日历 -->
                <div class="calendar-section" id="calendarSection2"></div>

                <!-- 返回 -->
                <div class="page-secondary-header">
                    <button class="back" id="backToHome">❮</button>
                    <span class="placeholder"></span>
                </div>

                <!-- 历史/道法 两个独立卡片 -->
                <div class="subject-cards-row" id="subjectCardsRow">
                    <div class="subject-card active" data-subject="history">
                        <div class="name">历史</div>
                        <div class="progress">已刷 <span class="num" id="histProgress">3</span> / 20 题</div>
                    </div>
                    <div class="subject-card" data-subject="politics">
                        <div class="name">道法</div>
                        <div class="progress">已刷 <span class="num" id="poliProgress">0</span> / 20 题</div>
                    </div>
                </div>

                <!-- 学习计划 - 留白加大 -->
                <div class="plan-title">学习计划</div>

                <!-- 七上 - 小字，无底色，靠下 -->
                <div class="module-label">七上</div>

                <!-- 单元列表 -->
                <div class="unit-list" id="unitList2"></div>

            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. 日历
        // ============================================================
        function renderCalendar(containerId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(today - now.getDay());
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(firstDayOfWeek.getDate() + i);
                weekDates.push(d);
            }
            let usedDays = {};
            try {
                const stored = localStorage.getItem('daofa_used_days');
                if (stored) usedDays = JSON.parse(stored);
            } catch (e) {}
            const todayKey = year + '-' + (month + 1) + '-' + today;
            if (!usedDays[todayKey]) {
                usedDays[todayKey] = true;
                localStorage.setItem('daofa_used_days', JSON.stringify(usedDays));
            }
            const weekAbbr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let html = '';
            html += '<div class="calendar-header">' + year + '.' + (month + 1) + '</div>';
            html += '<div class="calendar-week">';
            for (let i = 0; i < 7; i++) html += '<span>' + weekAbbr[i] + '</span>';
            html += '</div>';
            html += '<div class="calendar-days">';
            for (let i = 0; i < 7; i++) {
                const d = weekDates[i];
                const day = d.getDate();
                const isToday = (day === today && d.getMonth() === month && d.getFullYear() === year);
                const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + day;
                const used = !!usedDays[key];
                let cls = 'day';
                if (isToday) cls += ' today';
                if (used) cls += ' used-date';
                html += '<div class="' + cls + '">' +
                    '<span>' + day + '</span>' +
                    '<span class="dot' + (used ? ' used' : '') + '"></span>' +
                    '</div>';
            }
            html += '</div>';
            document.getElementById(containerId).innerHTML = html;
        }
        renderCalendar('calendarSection');
        renderCalendar('calendarSection2');

        // ============================================================
        // 2. 首页数据
        // ============================================================
        const HISTORY_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 10, total: 30, status: 'done' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 10, total: 30, status: 'active' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };
        const POLITICS_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 5, total: 30, status: 'active' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };

        const colorMap = {
            '七上': 'color-blue',
            '七下': 'color-blue',
            '八上': 'color-pink',
            '八下': 'color-pink',
            '九上': 'color-green',
            '九下': 'color-green'
        };
        const statusMap = {
            'done': { label: '已完成' },
            'active': { label: '进行中' },
            'pending': { label: '未开始' }
        };

        // ============================================================
        // 3. 首页渲染
        // ============================================================
        function renderGrid(subject) {
            const container = document.getElementById('gridContainer');
            const data = (subject === 'history') ? HISTORY_STATUS : POLITICS_STATUS;

            let totalDone = 0,
                totalAll = 0;
            for (let key in data) {
                totalDone += data[key].done || 0;
                totalAll += data[key].total || 0;
            }
            const weakModule = '八下 · 法治';

            const leftSmall = ['七下', '八下', '九下'];
            const rightSmall = ['七上', '八上', '九上'];

            const renderCard = (type, name, label, extra, rowStart, rowEnd, col) => {
                let cls = 'card-module';
                if (type === 'large') cls += ' large';
                else cls += ' small ' + (colorMap[name] || '');
                let content = '';
                if (type === 'large' && name === 'diagnosis') {
                    content = `
                            <div class="label">${label}</div>
