<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>道法历史 · 闯关</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: #F8F6F3;
            color: #1E1E1E;
            min-height: 100vh;
            padding: 20px 16px 80px;
            display: flex;
            justify-content: center;
        }
        .app { max-width: 480px; width: 100%; }

        /* 顶部 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
        .report-link {
            font-size: 14px;
            color: #8A8A8A;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 40px;
            background: #FFFFFF;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        /* 切换栏 */
        .tab-bar {
            display: flex;
            gap: 0;
            background: #FFFFFF;
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 36px;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: #8A8A8A;
            cursor: pointer;
            transition: all 0.25s;
        }
        .tab-btn.active {
            background: #F1EFEB;
            color: #1E1E1E;
        }
        /* 诊断入口 */
        .diagnostic-card {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 24px 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .diagnostic-left { display: flex; flex-direction: column; gap: 4px; }
        .diagnostic-title { font-size: 18px; font-weight: 600; }
        .diagnostic-desc { font-size: 14px; color: #8A8A8A; }
        .diagnostic-btn {
            background: #1E1E1E;
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        /* 模块列表 */
        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: #8A8A8A;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }
        .module-card {
            background: #FFFFFF;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .module-left { display: flex; flex-direction: column; gap: 4px; }
        .module-name { font-size: 16px; font-weight: 500; }
        .module-progress { font-size: 13px; color: #8A8A8A; }
        .module-bar {
            width: 80px;
            height: 6px;
            background: #E8E4DE;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .module-bar-fill {
            height: 100%;
            background: #1E1E1E;
            border-radius: 10px;
            width: 0%;
        }
        .module-status {
            font-size: 13px;
            font-weight: 500;
            color: #1E1E1E;
        }
        .footer {
            font-size: 13px;
            color: #B8B8B8;
            text-align: center;
            margin-top: 28px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 顶部 -->
    <div class="top-bar">
        <div class="brand">📖 道法历史</div>
        <div class="report-link" id="reportBtn">📊 诊断报告</div>
    </div>

    <!-- 切换 -->
    <div class="tab-bar">
        <button class="tab-btn active" data-subject="history">历史</button>
        <button class="tab-btn" data-subject="daofa">道法</button>
    </div>

    <!-- 诊断入口 -->
    <div class="diagnostic-card">
        <div class="diagnostic-left">
            <div class="diagnostic-title">测一测你的薄弱点</div>
            <div class="diagnostic-desc">10分钟 · 找到学习方向</div>
        </div>
        <button class="diagnostic-btn" id="diagnosticBtn">开始诊断</button>
    </div>

    <!-- 模块列表 -->
    <div class="section-title">学习模块</div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">七上</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">七下</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">八上</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">八下</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">九上</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card">
        <div class="module-left">
            <div class="module-name">九下</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="module-card" style="background:#F1EFEB;">
        <div class="module-left">
            <div class="module-name">⚡ 中考冲刺</div>
            <div class="module-progress">0 / 0 题</div>
            <div class="module-bar"><div class="module-bar-fill" style="width:0%;"></div></div>
        </div>
        <div class="module-status">未开始</div>
    </div>

    <div class="footer">道法历史 · 闯关诊断</div>
</div>

<script>
    // 切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            console.log('切换到：', this.dataset.subject);
        });
    });

    // 诊断按钮
    document.getElementById('diagnosticBtn').addEventListener('click', function() {
        alert('进入诊断模式');
    });

    // 诊断报告
    document.getElementById('reportBtn').addEventListener('click', function() {
        alert('查看诊断报告');
    });

    // 模块点击
    document.querySelectorAll('.module-card').forEach(card => {
        card.addEventListener('click', function() {
            const name = this.querySelector('.module-name')?.innerText || '模块';
            alert('进入：' + name);
        });
    });
</script>
</body>
</html>
