<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        /* ===== 重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 8px 10px 8px;
            margin-bottom: 14px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 15px;
            font-weight: 600;
            color: #2c241c;
            margin-bottom: 8px;
            text-align: left;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            color: #8a7a6a;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 14px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
        }
        .calendar-days .day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 600;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 品牌区（中灰色） ===== */
        .brand-section {
            background: #7a7a7a;
            border-radius: 14px;
            padding: 20px 18px;
            margin-bottom: 14px;
            flex-shrink: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        /* 极简装饰：极淡的几何线条 */
        .brand-section::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -5%;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }
        .brand-section::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: 10%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }
        .brand-text {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }
        .brand-text .history {
            color: #f5d6b8;
        }
        .brand-text .politics {
            color: #b8d4f5;
        }
        .brand-sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        /* ===== 两列网格（Grid固定行高） ===== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        /* ===== 卡片 ===== */
        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            min-height: 0;
            overflow: hidden;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }

        /* ===== 大模块（跨3行） ===== */
        .card-module.large {
            grid-row: span 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #faf8f6;
            border-color: #e8e0d8;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 700;
            color: #c49a6c;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        /* ===== 小模块（占1行） ===== */
        .card-module.small {
            padding: 8px 12px;
        }
        .card-module.small .label {
            font-size: 14px;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
        }

        /* 小模块颜色 */
        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #4a6a7a;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(74, 106, 122, 0.25);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
        }
        .btn-primary:active {
            background: #3a5a6a;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section {
                padding: 4px 6px 6px 6px;
                margin-bottom: 10px;
            }
            .calendar-header {
                font-size: 13px;
                margin-bottom: 4px;
            }
            .calendar-week {
                font-size: 9px;
            }
            .calendar-days .day {
                font-size: 12px;
                padding: 1px 0;
            }
            .calendar-days .day .dot {
                width: 3px;
                height: 3px;
            }
            .brand-section {
                height: 56px;
                padding: 14px 14px;
                margin-bottom: 10px;
            }
            .brand-text {
                font-size: 18px;
            }
            .brand-sub {
                font-size: 10px;
            }
            .card-module {
                padding: 6px 8px;
            }
            .card-module.large {
                padding-top: 8px;
            }
            .card-module.large .label {
                font-size: 13px;
            }
            .card-module.large .big-number {
                font-size: 18px;
            }
            .card-module.large .sub-line {
                font-size: 10px;
            }
            .card-module.large .weak-tag {
                font-size: 10px;
                padding: 2px 10px;
            }
            .card-module.small .label {
                font-size: 12px;
            }
            .btn-primary {
                padding: 10px 0;
                font-size: 14px;
                margin-top: 6px;
            }
            .btn-secondary {
                padding: 8px 0;
                font-size: 13px;
            }
            .grid-container {
                gap: 8px;
            }
        }
        @media (max-height: 600px) {
            .calendar-days .day {
                font-size: 10px;
            }
            .brand-section {
                height: 46px;
                padding: 10px 12px;
            }
            .brand-text {
                font-size: 15px;
            }
            .brand-sub {
                font-size: 9px;
            }
            .card-module.large .big-number {
                font-size: 15px;
            }
            .card-module.small .label {
                font-size: 11px;
            }
            .btn-primary {
                padding: 8px 0;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== 日历 ===== -->
        <div class="calendar-section" id="calendarSection"></div>

        <!-- ===== 品牌区 ===== -->
        <div class="brand-section">
            <div class="brand-text">
                <span class="history">历史</span> · <span class="politics">道法</span>
            </div>
            <div class="brand-sub">✦ 双科闯关</div>
        </div>

        <!-- ===== 两列网格 ===== -->
        <div class="grid-container" id="gridContainer">
            <!-- ===== 第2页：学科选择 ===== -->
<div class="page-secondary" id="pageSecondary" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#ffffff; z-index:1000; padding:20px 16px 30px; flex-direction:column; align-items:center; justify-content:center;">
    <div style="width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:20px;">

        <!-- 返回按钮 -->
        <div style="width:100%; display:flex; justify-content:flex-start;">
            <button id="backToHome" style="background:none; border:none; font-size:24px; color:#2c241c; cursor:pointer; padding:4px 0;">←</button>
        </div>

        <!-- 模块名称 -->
        <div style="font-size:24px; font-weight:600; color:#2c241c;" id="moduleTitle">七上</div>

        <!-- 学科选择 -->
        <div style="display:flex; gap:16px; width:100%; margin-top:10px;">
            <button class="subject-choice" data-subject="history" style="flex:1; padding:20px 0; border-radius:16px; border:none; font-size:20px; font-weight:500; color:#fff; background:#8a7a6a; cursor:pointer;">历史</button>
            <button class="subject-choice" data-subject="politics" style="flex:1; padding:20px 0; border-radius:16px; border:none; font-size:20px; font-weight:500; color:#fff; background:#5a6a7a; cursor:pointer;">道法</button>
        </div>

        <div style="font-size:14px; color:#8a7a6a; margin-top:10px;">选择学科开始刷题</div>
    </div>
</div>
            <!-- 由 JS 生成 -->
        </div>

        <!-- ===== 底部按钮 ===== -->
        <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
        <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>

    </div>

    <script>
        // ============================================================
        // 1. 日历
        // ============================================================
        (function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(today - now.getDay());
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(firstDayOfWeek.getDate() + i);
                weekDates.push(d);
            }
            let usedDays = {};
            try {
                const stored = localStorage.getItem('daofa_used_days');
                if (stored) usedDays = JSON.parse(stored);
            } catch (e) {}
            const todayKey = year + '-' + (month + 1) + '-' + today;
            if (!usedDays[todayKey]) {
                usedDays[todayKey] = true;
                localStorage.setItem('daofa_used_days', JSON.stringify(usedDays));
            }
            const weekAbbr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let html = '';
            html += '<div class="calendar-header">' + year + '.' + (month + 1) + '</div>';
            html += '<div class="calendar-week">';
            for (let i = 0; i < 7; i++) html += '<span>' + weekAbbr[i] + '</span>';
            html += '</div>';
            html += '<div class="calendar-days">';
            for (let i = 0; i < 7; i++) {
                const d = weekDates[i];
                const day = d.getDate();
                const isToday = (day === today && d.getMonth() === month && d.getFullYear() === year);
                const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + day;
                const used = !!usedDays[key];
                let cls = 'day';
                if (isToday) cls += ' today';
                if (used) cls += ' used-date';
                html += '<div class="' + cls + '">' +
                    '<span>' + day + '</span>' +
                    '<span class="dot' + (used ? ' used' : '') + '"></span>' +
                    '</div>';
            }
            html += '</div>';
            document.getElementById('calendarSection').innerHTML = html;
        })();

        // ============================================================
        // 2. 数据
        // ============================================================
        const HISTORY_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 10, total: 30, status: 'done' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 10, total: 30, status: 'active' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };
        const POLITICS_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 5, total: 30, status: 'active' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };

        const colorMap = {
            '七上': 'color-blue',
            '七下': 'color-blue',
            '八上': 'color-pink',
            '八下': 'color-pink',
            '九上': 'color-green',
            '九下': 'color-green'
        };
        const statusMap = {
            'done': { label: '已完成' },
            'active': { label: '进行中' },
            'pending': { label: '未开始' }
        };

        // ============================================================
        // 3. 渲染网格（Grid固定行列）
        // ============================================================
        function renderGrid(subject) {
            const container = document.getElementById('gridContainer');
            const data = (subject === 'history') ? HISTORY_STATUS : POLITICS_STATUS;

            let totalDone = 0,
                totalAll = 0;
            for (let key in data) {
                totalDone += data[key].done || 0;
                totalAll += data[key].total || 0;
            }
            const weakModule = '八下 · 法治';

            const leftSmall = ['七下', '八下', '九下'];
            const rightSmall = ['七上', '八上', '九上'];

            const renderCard = (type, name, label, extra, rowStart, rowEnd, col) => {
                let cls = 'card-module';
                if (type === 'large') cls += ' large';
                else cls += ' small ' + (colorMap[name] || '');
                let content = '';
                if (type === 'large' && name === 'diagnosis') {
                    content = `
                            <div class="label">${label}</div>
                            <div class="big-number">${extra.done}<span class="small"> / ${extra.total} 题</span></div>
                            <div class="sub-line">正确率 68%</div>
                            <div class="weak-tag">📌 薄弱：<strong>${extra.weak}</strong></div>
                        `;
                } else if (type === 'large' && name === 'sprint') {
                    content = `
                            <div class="label">${label}</div>
                            <div class="big-number">${extra.done}<span class="small"> 题</span></div>
                            <div class="sub-line">综合复习 · 查漏补缺</div>
                        `;
                } else {
                    const d = extra;
                    const info = statusMap[d.status] || statusMap['pending'];
                    content = `
                            <div class="label">${name}</div>
                            <div class="sub">${d.done > 0 ? d.done + '/' + d.total + ' 题' : info.label}</div>
                        `;
                }
                return `
                        <div class="${cls}" data-module="${name}" style="grid-row: ${rowStart} / ${rowEnd}; grid-column: ${col};">
                            ${content}
                        </div>
                    `;
            };

            let html = '';

            // 左列：学情诊断(行1-3) + 七下(行4) + 八下(行5) + 九下(行6)
            html += renderCard('large', 'diagnosis', '📊 学情诊断', { done: totalDone, total: totalAll, weak: weakModule }, 1, 4,
            1);
            for (let i = 0; i < leftSmall.length; i++) {
                const name = leftSmall[i];
                const d = data[name] || { done: 0, total: 0, status: 'pending' };
                html += renderCard('small', name, '', d, 4 + i, 5 + i, 1);
            }

            // 右列：七上(行1) + 八上(行2) + 九上(行3) + 中考冲刺(行4-6)
            for (let i = 0; i < rightSmall.length; i++) {
                const name = rightSmall[i];
                const d = data[name] || { done: 0, total: 0, status: 'pending' };
                html += renderCard('small', name, '', d, 1 + i, 2 + i, 2);
            }
            html += renderCard('large', 'sprint', '🎯 中考冲刺', { done: totalDone }, 4, 7, 2);

            container.innerHTML = html;

container.querySelectorAll('.card-module').forEach(function(el) {
    el.addEventListener('click', function() {
        const m = this.dataset.module;
        if (m === 'diagnosis') {
            alert('📊 学情诊断详情即将上线');
            return;
        }
        if (m === 'sprint') {
            alert('🎯 中考冲刺模块即将上线');
            return;
        }
        document.getElementById('pageSecondary').style.display = 'flex';
        document.getElementById('moduleTitle').textContent = m;
        window.selectedModule = m;
    });
});
        }

        // ============================================================
        // 4. 初始化
        // ============================================================
        renderGrid('history');

        // ============================================================
        // 5. 底部按钮
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            alert('🚀 诊断功能即将上线，敬请期待！');
        });
        document.getElementById('reportBtn').addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线，敬请期待！');
        });

        console.log('✅ 道法历史 · 闯关（中灰品牌区 + 墨蓝按钮）已加载');
    </script>
</body>
</html>
