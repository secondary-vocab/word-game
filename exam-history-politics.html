<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #f7f2eb;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 20px 40px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 28px 0;
        }
        .logo {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #2c241c;
        }
        .logo span {
            font-weight: 300;
            color: #8a7a6a;
        }
        .badge {
            font-size: 13px;
            color: #8a7a6a;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 16px 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(200, 180, 165, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge .dot {
            width: 7px;
            height: 7px;
            background: #c49a6c;
            border-radius: 50%;
            display: inline-block;
        }

        /* ===== 卡片 ===== */
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 24px 20px;
            box-shadow: 0 4px 24px rgba(180, 150, 120, 0.08);
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 4px;
        }
        .card-sub {
            font-size: 13px;
            color: #8a7a6a;
            margin-bottom: 16px;
        }

        /* ===== 学习路径（极简列表） ===== */
        .path-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(200, 180, 165, 0.15);
        }
        .path-item:last-child {
            border-bottom: none;
        }
        .path-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .path-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #d5cdc5;
        }
        .path-dot.done {
            background: #c49a6c;
        }
        .path-dot.active {
            background: #b8864a;
            box-shadow: 0 0 0 3px rgba(184, 134, 74, 0.12);
        }
        .path-name {
            font-size: 16px;
            font-weight: 450;
            color: #2c241c;
        }
        .path-meta {
            font-size: 13px;
            color: #8a7a6a;
        }
        .path-meta strong {
            color: #2c241c;
            font-weight: 500;
        }
        .path-tag {
            font-size: 11px;
            color: #8a7a6a;
            background: rgba(200, 180, 165, 0.15);
            padding: 2px 12px;
            border-radius: 30px;
        }
        .path-tag.done {
            color: #b8864a;
            background: rgba(184, 134, 74, 0.10);
        }
        .path-tag.active {
            color: #b8864a;
            background: rgba(184, 134, 74, 0.12);
        }

        /* ===== 按钮 ===== */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: #b8864a;
            color: #fff;
            box-shadow: 0 4px 20px rgba(184, 134, 74, 0.20);
            margin-bottom: 12px;
        }
        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        .btn-secondary {
            background: transparent;
            color: #8a7a6a;
            box-shadow: none;
            border: 1px solid rgba(200, 180, 165, 0.25);
            font-size: 15px;
        }
        .btn-secondary:active {
            background: rgba(200, 180, 165, 0.05);
        }

        /* ===== 刷题页（全屏） ===== */
        .quiz-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f7f2eb;
            z-index: 1000;
            flex-direction: column;
            padding: 24px 20px 28px;
        }
        .quiz-page.show {
            display: flex;
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            flex-shrink: 0;
        }
        .quiz-back {
            font-size: 26px;
            cursor: pointer;
            color: #2c241c;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 180, 165, 0.15);
            transition: all 0.15s;
        }
        .quiz-back:active {
            transform: scale(0.92);
        }
        .quiz-progress {
            font-size: 15px;
            color: #8a7a6a;
        }
        .quiz-progress strong {
            color: #2c241c;
            font-weight: 500;
        }

        /* 卡片滑动区 */
        .quiz-track-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            touch-action: none;
        }
        .quiz-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
            will-change: transform;
        }
        .quiz-card {
            min-width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 24px 20px;
            box-shadow: 0 4px 24px rgba(180, 150, 120, 0.06);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .quiz-card .q-meta {
            font-size: 12px;
            color: #b8864a;
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .quiz-card .q-module {
            font-size: 12px;
            color: #8a7a6a;
            margin-bottom: 20px;
        }
        .quiz-card .q-text {
            font-size: 20px;
            font-weight: 450;
            line-height: 1.7;
            color: #2c241c;
            margin-bottom: 28px;
        }
        .quiz-card .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-card .opt {
            padding: 14px 18px;
            border-radius: 14px;
            background: #f8f5f1;
            border: 1.5px solid transparent;
            font-size: 16px;
            color: #2c241c;
            transition: all 0.15s;
            cursor: pointer;
            user-select: none;
        }
        .quiz-card .opt:active {
            transform: scale(0.97);
        }
        .quiz-card .opt.correct {
            background: #f0f5ee;
            border-color: #c49a6c;
        }
        .quiz-card .opt.wrong {
            background: #f8efed;
            border-color: #d4a09a;
        }
        .quiz-card .opt.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .quiz-card .explanation {
            margin-top: 4px;
            padding: 16px 18px;
            border-radius: 14px;
            background: #f8f5f1;
            font-size: 14px;
            color: #5a4e44;
            line-height: 1.6;
            display: none;
        }
        .quiz-card .explanation.show {
            display: block;
        }
        .quiz-card .explanation strong {
            color: #2c241c;
            font-weight: 500;
        }

        .quiz-bottom {
            display: flex;
            gap: 14px;
            padding-top: 16px;
            flex-shrink: 0;
        }
        .quiz-bottom .nav-btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 450;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 180, 165, 0.15);
            color: #5a4e44;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .quiz-bottom .nav-btn:active {
            transform: scale(0.95);
        }
        .quiz-bottom .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .quiz-bottom .nav-btn.primary {
            background: #b8864a;
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px rgba(184, 134, 74, 0.15);
        }
        .quiz-bottom .nav-btn.primary:active {
            opacity: 0.9;
        }

        .quiz-card::-webkit-scrollbar {
            width: 0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            body {
                padding: 16px 14px 30px;
            }
            .card {
                padding: 20px 18px 16px;
                border-radius: 24px;
            }
            .path-name {
                font-size: 15px;
            }
            .quiz-card .q-text {
                font-size: 18px;
            }
            .quiz-card .opt {
                font-size: 15px;
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 首页 ========== -->
    <div class="app" id="homePage">
        <!-- 顶栏 -->
        <div class="header">
            <div class="logo">道法历史 <span>· 闯关</span></div>
            <div class="badge">
                <span class="dot"></span>
                八年级 · 诊断中
            </div>
        </div>

        <!-- 学习路径卡片 -->
        <div class="card">
            <div class="card-title">学习路径</div>
            <div class="card-sub">已诊断 0 / 200 题</div>
            <div id="pathList">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 按钮 -->
        <button class="btn" id="startBtn">开始诊断 · 10 分钟找到薄弱点</button>
        <button class="btn btn-secondary" id="reportBtn">诊断报告（即将上线）</button>
    </div>

    <!-- ========== 刷题页 ========== -->
    <div class="quiz-page" id="quizPage">
        <div class="quiz-top">
            <div class="quiz-back" id="quizBack">←</div>
            <div class="quiz-progress">第 <strong id="qIndexDisplay">1</strong> / <span id="qTotalDisplay">0</span> 题</div>
            <div style="width:44px;"></div>
        </div>

        <div class="quiz-track-wrap" id="trackWrap">
            <div class="quiz-track" id="track">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <div class="quiz-bottom">
            <button class="nav-btn" id="prevBtn">← 上一题</button>
            <button class="nav-btn primary" id="nextBtn">下一题 →</button>
        </div>
    </div>

    <script>
        // ================================================================
        // 示例题库（20题，八上 + 八下）
        // ================================================================
        const SAMPLE_QUESTIONS = [{
            id: 1,
            module: '八上',
            subject: '历史',
            question: '鸦片战争爆发于哪一年？',
            options: ['1838年', '1840年', '1842年', '1856年'],
            answer: 1,
            explanation: '1840年6月，英国发动鸦片战争，中国近代史开端。'
        }, {
            id: 2,
            module: '八上',
            subject: '历史',
            question: '《南京条约》中，中国被迫割让了哪个地方？',
            options: ['香港岛', '台湾岛', '澳门', '九龙半岛'],
            answer: 0,
            explanation: '《南京条约》规定割让香港岛给英国。'
        }, {
            id: 3,
            module: '八上',
            subject: '历史',
            question: '太平天国运动的领导人是谁？',
            options: ['洪秀全', '石达开', '李秀成', '杨秀清'],
            answer: 0,
            explanation: '洪秀全于1851年在金田起义，建立太平天国。'
        }, {
            id: 4,
            module: '八上',
            subject: '历史',
            question: '洋务运动的口号是什么？',
            options: ['自强求富', '变法维新', '民主科学', '救亡图存'],
            answer: 0,
            explanation: '洋务运动以“自强”为前期口号，“求富”为后期口号。'
        }, {
            id: 5,
            module: '八上',
            subject: '历史',
            question: '戊戌变法发生在哪一年？',
            options: ['1895年', '1898年', '1900年', '1901年'],
            answer: 1,
            explanation: '1898年6月，光绪帝颁布“明定国是”诏书，开始变法。'
        }, {
            id: 6,
            module: '八上',
            subject: '历史',
            question: '辛亥革命爆发于哪一年？',
            options: ['1898年', '1901年', '1911年', '1912年'],
            answer: 2,
            explanation: '1911年10月10日，武昌起义爆发，辛亥革命开始。'
        }, {
            id: 7,
            module: '八上',
            subject: '历史',
            question: '中国历史上第一部具有资产阶级共和国宪法性质的文件是？',
            options: ['《钦定宪法大纲》', '《中华民国临时约法》', '《共同纲领》', '《五四宪法》'],
            answer: 1,
            explanation: '1912年颁布的《中华民国临时约法》是中国第一部资产阶级宪法性质的文件。'
        }, {
            id: 8,
            module: '八上',
            subject: '历史',
            question: '新文化运动的口号是？',
            options: ['自强求富', '民主科学', '救亡图存', '变法维新'],
            answer: 1,
            explanation: '新文化运动高举“民主”与“科学”两面大旗。'
        }, {
            id: 9,
            module: '八上',
            subject: '历史',
            question: '五四运动爆发的直接导火索是什么？',
            options: ['巴黎和会上中国外交失败', '军阀混战', '新文化运动', '十月革命'],
            answer: 0,
            explanation: '1919年巴黎和会上中国外交失败，引发了五四运动。'
        }, {
            id: 10,
            module: '八上',
            subject: '历史',
            question: '中国共产党成立的时间是？',
            options: ['1919年', '1920年', '1921年', '1922年'],
            answer: 2,
            explanation: '1921年7月23日，中共一大在上海召开，中国共产党诞生。'
        }, {
            id: 11,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，中华人民共和国的一切权力属于谁？',
            options: ['人民', '中国共产党', '全国人大', '国务院'],
            answer: 0,
            explanation: '宪法第二条明确规定：一切权力属于人民。'
        }, {
            id: 12,
            module: '八下',
            subject: '道法',
            question: '公民最基本的政治权利是什么？',
            options: ['言论自由', '选举权和被选举权', '监督权', '人身自由'],
            answer: 1,
            explanation: '选举权和被选举权是公民参与国家管理的最基本政治权利。'
        }, {
            id: 13,
            module: '八下',
            subject: '道法',
            question: '我国的根本政治制度是？',
            options: ['人民代表大会制度', '中国共产党领导的多党合作制', '民族区域自治制度', '基层群众自治制度'],
            answer: 0,
            explanation: '人民代表大会制度是我国的根本政治制度。'
        }, {
            id: 14,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民有依法纳税的义务，这属于什么权利？',
            options: ['基本权利', '基本义务', '既是权利也是义务', '以上都不对'],
            answer: 1,
            explanation: '依法纳税是公民的基本义务，不是权利。'
        }, {
            id: 15,
            module: '八下',
            subject: '道法',
            question: '我国的国家机构实行什么组织原则？',
            options: ['民主集中制', '民主制', '集中制', '分权制'],
            answer: 0,
            explanation: '我国国家机构实行民主集中制原则。'
        }, {
            id: 16,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民的人身自由不受侵犯。以下属于人身自由的是？',
            options: ['言论自由', '通信自由', '集会自由', '结社自由'],
            answer: 1,
            explanation: '通信自由属于人身自由的范畴，受宪法保护。'
        }, {
            id: 17,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，国家推广什么语言？',
            options: ['普通话', '方言', '少数民族语言', '外语'],
            answer: 0,
            explanation: '宪法规定国家推广普通话。'
        }, {
            id: 18,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民的通信自由和通信秘密受法律保护，除因什么需要外？',
            options: ['国家安全或追查刑事犯罪', '个人隐私', '商业调查', '家庭原因'],
            answer: 0,
            explanation: '宪法规定，除因国家安全或追查刑事犯罪需要外，通信秘密受法律保护。'
        }, {
            id: 19,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，中华人民共和国公民在法律面前一律什么？',
            options: ['平等', '自由', '公正', '民主'],
            answer: 0,
            explanation: '宪法第三十三条规定：公民在法律面前一律平等。'
        }, {
            id: 20,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，国家尊重和保障什么？',
            options: ['人权', '公民权', '政治权', '财产权'],
            answer: 0,
            explanation: '宪法第三十三条第三款规定：国家尊重和保障人权。'
        }];

        // ================================================================
        // 状态
        // ================================================================
        const state = {
            questions: [],
            currentIndex: 0,
            answered: false,
            history: {}, // questionId -> selectedOptionIndex
        };

        // DOM
        const homePage = document.getElementById('homePage');
        const quizPage = document.getElementById('quizPage');
        const track = document.getElementById('track');
        const qIndexDisplay = document.getElementById('qIndexDisplay');
        const qTotalDisplay = document.getElementById('qTotalDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const startBtn = document.getElementById('startBtn');
        const reportBtn = document.getElementById('reportBtn');
        const quizBack = document.getElementById('quizBack');
        const pathList = document.getElementById('pathList');

        // ================================================================
        // 路径渲染
        // ================================================================
        const MODULES = ['七上', '七下', '八上', '八下', '九上', '九下', '中考冲刺'];
        const MODULE_STATUS = {
            '七上': 'done',
            '七下': 'done',
            '八上': 'done',
            '八下': 'active',
            '九上': 'pending',
            '九下': 'pending',
            '中考冲刺': 'pending'
        };
        const MODULE_COUNT = {
            '七上': 0,
            '七下': 0,
            '八上': 10,
            '八下': 10,
            '九上': 0,
            '九下': 0,
            '中考冲刺': 0
        };

        function renderPath() {
            let html = '';
            MODULES.forEach(m => {
                const status = MODULE_STATUS[m] || 'pending';
                const count = MODULE_COUNT[m] || 0;
                const dotClass = status === 'done' ? 'done' : status === 'active' ? 'active' : '';
                const tagClass = status === 'done' ? 'done' : status === 'active' ? 'active' : '';
                const tagText = status === 'done' ? '已完成' : status === 'active' ? '进行中' : '未开始';
                const countText = count > 0 ? `${count} 题` : '';
                html += `
                    <div class="path-item">
                        <div class="path-left">
                            <span class="path-dot ${dotClass}"></span>
                            <span class="path-name">${m}</span>
                        </div>
                        <div class="path-meta">
                            ${countText ? `<strong>${countText}</strong> ` : ''}
                            <span class="path-tag ${tagClass}">${tagText}</span>
                        </div>
                    </div>
                `;
            });
            pathList.innerHTML = html;
        }
        renderPath();

        // ================================================================
        // 刷题引擎
        // ================================================================
        function initQuiz(questions) {
            state.questions = questions;
            state.currentIndex = 0;
            state.answered = false;
            state.history = {};

            qTotalDisplay.textContent = questions.length;
            renderCards(questions);
            updateCardPosition(0);
            updateUI();
        }

        function renderCards(questions) {
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            questions.forEach((q, idx) => {
                const optsHtml = q.options.map((opt, oi) =>
                    `<div class="opt" data-q="${idx}" data-opt="${oi}">${letters[oi]}. ${opt}</div>`
                ).join('');
                html += `
                    <div class="quiz-card" data-index="${idx}">
                        <div class="q-meta">${q.subject} · ${q.module}</div>
                        <div class="q-module">模块：${q.module}</div>
                        <div class="q-text">${q.question}</div>
                        <div class="options">${optsHtml}</div>
                        <div class="explanation" id="expl-${idx}"><strong>解析</strong> ${q.explanation}</div>
                    </div>
                `;
            });
            track.innerHTML = html;

            // 选项点击
            track.querySelectorAll('.opt').forEach(el => {
                el.addEventListener('click', function() {
                    const qIdx = parseInt(this.dataset.q);
                    const optIdx = parseInt(this.dataset.opt);
                    if (state.answered || qIdx !== state.currentIndex) return;
                    handleSelect(qIdx, optIdx);
                });
            });
        }

        function handleSelect(qIdx, optIdx) {
            const q = state.questions[qIdx];
            const card = track.querySelector(`.quiz-card[data-index="${qIdx}"]`);
            if (!card) return;

            const opts = card.querySelectorAll('.opt');
            const expl = card.querySelector('.explanation');

            const isCorrect = (optIdx === q.answer);
            opts.forEach((o, i) => {
                o.classList.add('disabled');
                if (i === q.answer) o.classList.add('correct');
                if (i === optIdx && !isCorrect) o.classList.add('wrong');
            });

            expl.classList.add('show');
            state.answered = true;
            state.history[q.id] = optIdx;

            updateUI();
        }

        function updateCardPosition(index) {
            const wrap = document.getElementById('trackWrap');
            const cardWidth = wrap.clientWidth || 380;
            track.style.transform = `translateX(-${index * cardWidth}px)`;
            state.currentIndex = index;
            state.answered = false;

            // 恢复已答状态
            const q = state.questions[index];
            if (q && state.history[q.id] !== undefined) {
                const card = track.querySelector(`.quiz-card[data-index="${index}"]`);
                if (card) {
                    const opts = card.querySelectorAll('.opt');
                    const expl = card.querySelector('.explanation');
                    const prevOpt = state.history[q.id];
                    const isCorrect = (prevOpt === q.answer);
                    opts.forEach((o, i) => {
                        o.classList.add('disabled');
                        if (i === q.answer) o.classList.add('correct');
                        if (i === prevOpt && !isCorrect) o.classList.add('wrong');
                    });
                    expl.classList.add('show');
                    state.answered = true;
                }
            }

            qIndexDisplay.textContent = index + 1;
            updateUI();
        }

        function updateUI() {
            const total = state.questions.length;
            const idx = state.currentIndex;
            prevBtn.disabled = (idx === 0);
            nextBtn.textContent = (idx === total - 1) ? '📊 查看报告' : '下一题 →';
        }

        // ================================================================
        // 导航
        // ================================================================
        function goPrev() {
            if (state.currentIndex > 0) updateCardPosition(state.currentIndex - 1);
        }

        function goNext() {
            const q = state.questions[state.currentIndex];
            if (!state.answered && state.history[q.id] === undefined) {
                // 闪一下提示
                const card = track.querySelector(`.quiz-card[data-index="${state.currentIndex}"]`);
                if (card) {
                    card.style.transition = 'all 0.1s';
                    card.style.backgroundColor = '#f8efed';
                    setTimeout(() => {
                        card.style.backgroundColor = '#ffffff';
                    }, 300);
                }
                return;
            }
            if (state.currentIndex < state.questions.length - 1) {
                updateCardPosition(state.currentIndex + 1);
            } else {
                const total = state.questions.length;
                const correct = Object.values(state.history).filter((v, i) => v === state.questions[i].answer).length;
                alert(`✅ 诊断完成！\n\n共 ${total} 题，正确 ${correct} 题，正确率 ${Math.round(correct/total*100)}%\n薄弱模块将根据错题生成。`);
            }
        }

        // ================================================================
        // 事件绑定
        // ================================================================
        startBtn.addEventListener('click', () => {
            if (SAMPLE_QUESTIONS.length === 0) { alert('题库为空'); return; }
            homePage.style.display = 'none';
            quizPage.classList.add('show');
            initQuiz(SAMPLE_QUESTIONS);
        });

        quizBack.addEventListener('click', () => {
            quizPage.classList.remove('show');
            homePage.style.display = 'block';
        });

        prevBtn.addEventListener('click', goPrev);
        nextBtn.addEventListener('click', goNext);

        reportBtn.addEventListener('click', () => {
            alert('📊 诊断报告即将上线\n完成诊断后，系统将自动分析你的薄弱知识点。');
        });

        // ================================================================
        // 触摸滑动（左右翻题）
        // ================================================================
        let touchStartX = 0,
            touchStartY = 0,
            isSwiping = false;
        const wrap = document.getElementById('trackWrap');

        wrap.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            isSwiping = false;
        }, { passive: true });

        wrap.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                isSwiping = true;
                e.preventDefault();
            }
        }, { passive: false });

        wrap.addEventListener('touchend', (e) => {
            if (!isSwiping) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            if (dx < -50) goNext();
            else if (dx > 50) goPrev();
        }, { passive: true });

        // ================================================================
        // 键盘支持
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (!quizPage.classList.contains('show')) return;
            if (e.key === 'ArrowLeft') goPrev();
            if (e.key === 'ArrowRight') goNext();
        });

        // ================================================================
        // resize 自适应
        // ================================================================
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (quizPage.classList.contains('show')) {
                    const idx = state.currentIndex || 0;
                    const w = document.getElementById('trackWrap').clientWidth || 380;
                    track.style.transition = 'none';
                    track.style.transform = `translateX(-${idx * w}px)`;
                    requestAnimationFrame(() => {
                        track.style.transition = 'transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1)';
                    });
                }
            }, 200);
        });

        console.log('✅ 道法历史闯关已加载（清晨咖啡馆风格）');
    </script>
</body>
</html>
