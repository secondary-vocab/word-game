<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>道法历史闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0ece6;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 20px 16px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app {
            max-width: 420px;
            width: 100%;
        }

        /* 顶部 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1a1a1a;
        }
        .logo span {
            color: #f5a342;
        }
        .user-badge {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 6px 16px 6px 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #555;
        }
        .user-badge .dot {
            width: 8px;
            height: 8px;
            background: #5fcb7a;
            border-radius: 50%;
            display: inline-block;
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px 20px 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
        }

        /* 路径列表 */
        .path-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .path-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 14px;
            transition: all 0.2s;
            background: transparent;
        }
        .path-item.active {
            background: rgba(245, 163, 66, 0.10);
            border-left: 3px solid #f5a342;
        }
        .path-item .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .path-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .path-item .dot.done {
            background: #5fcb7a;
        }
        .path-item .dot.active {
            background: #f5a342;
            box-shadow: 0 0 0 3px rgba(245, 163, 66, 0.2);
        }
        .path-item .dot.pending {
            background: #d0ccc6;
        }
        .path-item .name {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .path-item .right {
            font-size: 13px;
            color: #999;
        }
        .path-item .right .count {
            color: #1a1a1a;
            font-weight: 500;
        }
        .path-item .status-tag {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 30px;
            background: rgba(95, 203, 122, 0.12);
            color: #5fcb7a;
        }
        .path-item .status-tag.pending {
            background: rgba(0, 0, 0, 0.04);
            color: #bbb;
        }

        /* 主按钮 */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #f5a342, #e8892a);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(245, 163, 66, 0.25);
            margin-top: 8px;
        }
        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
        .btn-secondary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #555;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }
        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* ===== 刷题页 ===== */
        .quiz-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0ece6;
            z-index: 1000;
            flex-direction: column;
            padding: 20px 16px 30px;
            overflow: hidden;
        }
        .quiz-page.show {
            display: flex;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }
        .quiz-header .back {
            font-size: 24px;
            cursor: pointer;
            color: #1a1a1a;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }
        .quiz-header .back:active {
            transform: scale(0.92);
        }
        .quiz-header .progress-text {
            font-size: 15px;
            color: #888;
            font-weight: 500;
        }
        .quiz-header .progress-text span {
            color: #1a1a1a;
            font-weight: 600;
        }

        /* 卡片容器 - 支持触摸滑动 */
        .quiz-card-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            touch-action: none;
        }
        .quiz-card-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .quiz-card {
            min-width: 100%;
            height: 100%;
            padding: 28px 22px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .quiz-card .q-meta {
            font-size: 12px;
            color: #f5a342;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .quiz-card .q-module {
            font-size: 12px;
            color: #bbb;
            margin-bottom: 16px;
        }
        .quiz-card .q-text {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.7;
            color: #1a1a1a;
            margin-bottom: 24px;
        }
        .quiz-card .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-card .opt {
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.02);
            border: 1.5px solid rgba(0, 0, 0, 0.04);
            font-size: 16px;
            color: #1a1a1a;
            transition: all 0.15s;
            cursor: pointer;
            user-select: none;
        }
        .quiz-card .opt:active {
            transform: scale(0.97);
        }
        .quiz-card .opt.correct {
            border-color: #5fcb7a;
            background: rgba(95, 203, 122, 0.08);
        }
        .quiz-card .opt.wrong {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.08);
        }
        .quiz-card .opt.disabled {
            opacity: 0.6;
            pointer-events: none;
        }
        .quiz-card .explanation {
            margin-top: 6px;
            padding: 16px 18px;
            border-radius: 14px;
            background: rgba(245, 163, 66, 0.06);
            border-left: 3px solid #f5a342;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            display: none;
        }
        .quiz-card .explanation.show {
            display: block;
        }
        .quiz-card .explanation strong {
            color: #1a1a1a;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding-top: 16px;
            flex-shrink: 0;
        }
        .quiz-footer .nav-btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .quiz-footer .nav-btn:active {
            transform: scale(0.95);
        }
        .quiz-footer .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .quiz-footer .nav-btn.primary {
            background: linear-gradient(135deg, #f5a342, #e8892a);
            color: #fff;
            border: none;
        }
        .quiz-footer .nav-btn.primary:active {
            opacity: 0.9;
        }

        /* 响应式 */
        @media (max-width: 420px) {
            .path-item {
                padding: 12px 14px;
            }
            .path-item .name {
                font-size: 15px;
            }
            .quiz-card .q-text {
                font-size: 18px;
            }
            .quiz-card .opt {
                font-size: 15px;
                padding: 12px 16px;
            }
        }

        /* 滚动条隐藏 */
        .quiz-card::-webkit-scrollbar {
            width: 0;
        }
    </style>
</head>
<body>

    <div class="app" id="homePage">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo">道法历史<span>·闯关</span></div>
            <div class="user-badge">
                <span class="dot"></span>
                八年级 · 诊断中
            </div>
        </div>

        <!-- 路径卡片 -->
        <div class="glass-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <span style="font-size:15px;font-weight:500;color:#1a1a1a;">学习路径</span>
                <span style="font-size:12px;color:#999;">已诊断 0 / 200 题</span>
            </div>
            <div class="path-list" id="pathList">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <!-- 按钮 -->
        <button class="btn-primary" id="startBtn">🚀 开始诊断 · 10分钟找到薄弱点</button>
        <button class="btn-secondary" id="reportBtn">📊 诊断报告（即将上线）</button>
    </div>

    <!-- ===== 刷题页 ===== -->
    <div class="quiz-page" id="quizPage">
        <div class="quiz-header">
            <div class="back" id="quizBack">←</div>
            <div class="progress-text">第 <span id="qIndexDisplay">1</span> / <span id="qTotalDisplay">0</span> 题</div>
            <div style="width:44px;"></div>
        </div>

        <div class="quiz-card-wrap" id="cardWrap">
            <div class="quiz-card-track" id="cardTrack">
                <!-- 由 JS 动态生成 -->
            </div>
        </div>

        <div class="quiz-footer">
            <button class="nav-btn" id="prevBtn">← 上一题</button>
            <button class="nav-btn primary" id="nextBtn">下一题 →</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 示例题库（共20题，覆盖八上、八下两个模块）
        // 实际使用时替换为完整题库，每道题包含：
        //   id, module, subject, question, options[], answer (0-3), explanation
        // ============================================================
        const SAMPLE_QUESTIONS = [{
            id: 1,
            module: '八上',
            subject: '历史',
            question: '鸦片战争爆发于哪一年？',
            options: ['1838年', '1840年', '1842年', '1856年'],
            answer: 1,
            explanation: '1840年6月，英国发动鸦片战争，是中国近代史的开端。'
        }, {
            id: 2,
            module: '八上',
            subject: '历史',
            question: '《南京条约》中，中国被迫割让了哪个地方？',
            options: ['香港岛', '台湾岛', '澳门', '九龙半岛'],
            answer: 0,
            explanation: '《南京条约》规定中国割让香港岛给英国。'
        }, {
            id: 3,
            module: '八上',
            subject: '历史',
            question: '太平天国运动的领导人是谁？',
            options: ['洪秀全', '石达开', '李秀成', '杨秀清'],
            answer: 0,
            explanation: '洪秀全于1851年在金田起义，建立太平天国。'
        }, {
            id: 4,
            module: '八上',
            subject: '历史',
            question: '洋务运动的口号是什么？',
            options: ['自强求富', '变法维新', '民主科学', '救亡图存'],
            answer: 0,
            explanation: '洋务运动以“自强”为前期口号，“求富”为后期口号。'
        }, {
            id: 5,
            module: '八上',
            subject: '历史',
            question: '戊戌变法发生在哪一年？',
            options: ['1895年', '1898年', '1900年', '1901年'],
            answer: 1,
            explanation: '1898年6月，光绪帝颁布“明定国是”诏书，开始变法。'
        }, {
            id: 6,
            module: '八上',
            subject: '历史',
            question: '辛亥革命爆发于哪一年？',
            options: ['1898年', '1901年', '1911年', '1912年'],
            answer: 2,
            explanation: '1911年10月10日，武昌起义爆发，辛亥革命开始。'
        }, {
            id: 7,
            module: '八上',
            subject: '历史',
            question: '中国历史上第一部具有资产阶级共和国宪法性质的文件是？',
            options: ['《钦定宪法大纲》', '《中华民国临时约法》', '《共同纲领》', '《五四宪法》'],
            answer: 1,
            explanation: '1912年颁布的《中华民国临时约法》是中国第一部资产阶级宪法性质的文件。'
        }, {
            id: 8,
            module: '八上',
            subject: '历史',
            question: '新文化运动的口号是？',
            options: ['自强求富', '民主科学', '救亡图存', '变法维新'],
            answer: 1,
            explanation: '新文化运动高举“民主”与“科学”两面大旗。'
        }, {
            id: 9,
            module: '八上',
            subject: '历史',
            question: '五四运动爆发的直接导火索是什么？',
            options: ['巴黎和会上中国外交失败', '军阀混战', '新文化运动', '十月革命'],
            answer: 0,
            explanation: '1919年巴黎和会上中国外交失败，引发了五四运动。'
        }, {
            id: 10,
            module: '八上',
            subject: '历史',
            question: '中国共产党成立的时间是？',
            options: ['1919年', '1920年', '1921年', '1922年'],
            answer: 2,
            explanation: '1921年7月23日，中共一大在上海召开，中国共产党诞生。'
        }, {
            id: 11,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，中华人民共和国的一切权力属于谁？',
            options: ['人民', '中国共产党', '全国人大', '国务院'],
            answer: 0,
            explanation: '宪法第二条明确规定：一切权力属于人民。'
        }, {
            id: 12,
            module: '八下',
            subject: '道法',
            question: '公民最基本的政治权利是什么？',
            options: ['言论自由', '选举权和被选举权', '监督权', '人身自由'],
            answer: 1,
            explanation: '选举权和被选举权是公民参与国家管理的最基本政治权利。'
        }, {
            id: 13,
            module: '八下',
            subject: '道法',
            question: '我国的根本政治制度是？',
            options: ['人民代表大会制度', '中国共产党领导的多党合作制', '民族区域自治制度', '基层群众自治制度'],
            answer: 0,
            explanation: '人民代表大会制度是我国的根本政治制度。'
        }, {
            id: 14,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民有依法纳税的义务，这属于什么权利？',
            options: ['基本权利', '基本义务', '既是权利也是义务', '以上都不对'],
            answer: 1,
            explanation: '依法纳税是公民的基本义务，不是权利。'
        }, {
            id: 15,
            module: '八下',
            subject: '道法',
            question: '我国的国家机构实行什么组织原则？',
            options: ['民主集中制', '民主制', '集中制', '分权制'],
            answer: 0,
            explanation: '我国国家机构实行民主集中制原则。'
        }, {
            id: 16,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民的人身自由不受侵犯。以下属于人身自由的是？',
            options: ['言论自由', '通信自由', '集会自由', '结社自由'],
            answer: 1,
            explanation: '通信自由属于人身自由的范畴，受宪法保护。'
        }, {
            id: 17,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，国家推广什么语言？',
            options: ['普通话', '方言', '少数民族语言', '外语'],
            answer: 0,
            explanation: '宪法规定国家推广普通话。'
        }, {
            id: 18,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，公民的通信自由和通信秘密受法律保护，除因什么需要外？',
            options: ['国家安全或追查刑事犯罪', '个人隐私', '商业调查', '家庭原因'],
            answer: 0,
            explanation: '宪法规定，除因国家安全或追查刑事犯罪需要外，通信秘密受法律保护。'
        }, {
            id: 19,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，中华人民共和国公民在法律面前一律什么？',
            options: ['平等', '自由', '公正', '民主'],
            answer: 0,
            explanation: '宪法第三十三条规定：公民在法律面前一律平等。'
        }, {
            id: 20,
            module: '八下',
            subject: '道法',
            question: '我国宪法规定，国家尊重和保障什么？',
            options: ['人权', '公民权', '政治权', '财产权'],
            answer: 0,
            explanation: '宪法第三十三条第三款规定：国家尊重和保障人权。'
        }];

        // ============================================================
        // 应用状态
        // ============================================================
        const state = {
            questions: [],
            currentIndex: 0,
            answered: false,
            selectedOption: -1,
            history: {}, // { questionId: selectedIndex }
            wrongIds: new Set(),
            correctIds: new Set(),
        };

        // DOM 引用
        const homePage = document.getElementById('homePage');
        const quizPage = document.getElementById('quizPage');
        const cardTrack = document.getElementById('cardTrack');
        const qIndexDisplay = document.getElementById('qIndexDisplay');
        const qTotalDisplay = document.getElementById('qTotalDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const startBtn = document.getElementById('startBtn');
        const reportBtn = document.getElementById('reportBtn');
        const quizBack = document.getElementById('quizBack');
        const pathList = document.getElementById('pathList');

        // ============================================================
        // 路径渲染
        // ============================================================
        const MODULES = ['七上', '七下', '八上', '八下', '九上', '九下', '中考冲刺'];
        // 假设已完成：八上已做完，八下进行中
        const MODULE_STATUS = {
            '七上': 'done',
            '七下': 'done',
            '八上': 'done',
            '八下': 'active',
            '九上': 'pending',
            '九下': 'pending',
            '中考冲刺': 'pending'
        };
        const MODULE_COUNT = {
            '七上': 0,
            '七下': 0,
            '八上': 10,
            '八下': 10,
            '九上': 0,
            '九下': 0,
            '中考冲刺': 0
        };

        function renderPath() {
            let html = '';
            MODULES.forEach(m => {
                const status = MODULE_STATUS[m] || 'pending';
                const count = MODULE_COUNT[m] || 0;
                const dotClass = status === 'done' ? 'done' : status === 'active' ? 'active' : 'pending';
                const statusText = status === 'done' ? '已完成' : status === 'active' ? '进行中' : '未开始';
                const statusTagClass = status === 'done' ? '' : 'pending';
                const activeClass = status === 'active' ? 'active' : '';
                html += `
                    <div class="path-item ${activeClass}">
                        <div class="left">
                            <span class="dot ${dotClass}"></span>
                            <span class="name">${m}</span>
                        </div>
                        <div class="right">
                            ${count > 0 ? `<span class="count">${count}</span> 题` : ''}
                            <span class="status-tag ${statusTagClass}">${statusText}</span>
                        </div>
                    </div>
                `;
            });
            pathList.innerHTML = html;
        }
        renderPath();

        // ============================================================
        // 刷题引擎
        // ============================================================
        function initQuiz(questions) {
            state.questions = questions;
            state.currentIndex = 0;
            state.answered = false;
            state.selectedOption = -1;
            state.history = {};
            state.wrongIds = new Set();
            state.correctIds = new Set();

            qTotalDisplay.textContent = questions.length;
            renderCards(questions);
            updateCardPosition(0);
            updateQuizUI();
        }

        function renderCards(questions) {
            let html = '';
            questions.forEach((q, idx) => {
                const letter = ['A', 'B', 'C', 'D'];
                let optsHtml = q.options.map((opt, oi) => {
                    return `<div class="opt" data-q="${idx}" data-opt="${oi}">${letter[oi]}. ${opt}</div>`;
                }).join('');
                html += `
                    <div class="quiz-card" data-index="${idx}">
                        <div class="q-meta">${q.subject} · ${q.module}</div>
                        <div class="q-module">模块：${q.module}</div>
                        <div class="q-text">${q.question}</div>
                        <div class="options">${optsHtml}</div>
                        <div class="explanation" id="explanation-${idx}"><strong>解析：</strong>${q.explanation}</div>
                    </div>
                `;
            });
            cardTrack.innerHTML = html;

            // 绑定选项点击事件（委托）
            cardTrack.querySelectorAll('.opt').forEach(el => {
                el.addEventListener('click', function(e) {
                    const qIdx = parseInt(this.dataset.q);
                    const optIdx = parseInt(this.dataset.opt);
                    handleOptionClick(qIdx, optIdx);
                });
            });
        }

        function handleOptionClick(qIdx, optIdx) {
            if (state.answered) return;
            if (qIdx !== state.currentIndex) return;

            const q = state.questions[qIdx];
            const card = cardTrack.querySelector(`.quiz-card[data-index="${qIdx}"]`);
            if (!card) return;

            const opts = card.querySelectorAll('.opt');
            const expl = card.querySelector('.explanation');

            // 禁用所有选项
            opts.forEach(o => o.classList.add('disabled'));

            // 标记正确/错误
            const isCorrect = (optIdx === q.answer);
            opts.forEach((o, i) => {
                if (i === q.answer) o.classList.add('correct');
                if (i === optIdx && !isCorrect) o.classList.add('wrong');
            });

            // 显示解析
            expl.classList.add('show');

            state.answered = true;
            state.selectedOption = optIdx;
            state.history[q.id] = optIdx;
            if (isCorrect) {
                state.correctIds.add(q.id);
            } else {
                state.wrongIds.add(q.id);
            }

            // 更新底部按钮文案
            updateQuizUI();
        }

        function updateCardPosition(index) {
            const track = cardTrack;
            const cardWidth = track.parentElement.clientWidth || 380;
            track.style.transform = `translateX(-${index * cardWidth}px)`;
            qIndexDisplay.textContent = index + 1;
            state.currentIndex = index;
            state.answered = false;
            state.selectedOption = -1;

            // 重置卡片状态
            const card = cardTrack.querySelector(`.quiz-card[data-index="${index}"]`);
            if (card) {
                const opts = card.querySelectorAll('.opt');
                const expl = card.querySelector('.explanation');
                opts.forEach(o => {
                    o.classList.remove('correct', 'wrong', 'disabled');
                });
                expl.classList.remove('show');

                // 如果这道题之前答过，恢复状态
                const q = state.questions[index];
                if (q && state.history[q.id] !== undefined) {
                    const prevOpt = state.history[q.id];
                    const isCorrect = (prevOpt === q.answer);
                    opts.forEach((o, i) => {
                        if (i === q.answer) o.classList.add('correct');
                        if (i === prevOpt && !isCorrect) o.classList.add('wrong');
                        o.classList.add('disabled');
                    });
                    expl.classList.add('show');
                    state.answered = true;
                    state.selectedOption = prevOpt;
                }
            }

            updateQuizUI();
        }

        function updateQuizUI() {
            const total = state.questions.length;
            const idx = state.currentIndex;
            qIndexDisplay.textContent = idx + 1;
            prevBtn.disabled = (idx === 0);
            // 下一题按钮文字
            if (idx === total - 1) {
                nextBtn.textContent = '📊 查看报告';
            } else {
                nextBtn.textContent = '下一题 →';
            }
            // 如果当前题已答，下一题可点；否则不可点
            // 但为了体验，让用户必须答题才能继续，已经通过选项点击控制
            // 下一题始终可点，但如果未答则提示
        }

        // ============================================================
        // 导航
        // ============================================================
        function goToPrev() {
            if (state.currentIndex > 0) {
                updateCardPosition(state.currentIndex - 1);
            }
        }

        function goToNext() {
            const q = state.questions[state.currentIndex];
            if (!state.answered && state.history[q.id] === undefined) {
                // 提示用户先答题
                const card = cardTrack.querySelector(`.quiz-card[data-index="${state.currentIndex}"]`);
                if (card) {
                    const opts = card.querySelectorAll('.opt');
                    opts.forEach(o => {
                        o.style.transition = 'all 0.1s';
                        o.style.borderColor = '#ff6b6b';
                        setTimeout(() => {
                            o.style.borderColor = '';
                        }, 400);
                    });
                }
                return;
            }
            if (state.currentIndex < state.questions.length - 1) {
                updateCardPosition(state.currentIndex + 1);
            } else {
                // 最后一题，查看报告
                alert('🎉 诊断完成！你已完成全部20题。\n正确率：' + Math.round(state.correctIds.size / state.questions.length *
                    100) + '%\n薄弱模块将根据错题分析生成。');
                // 这里可以跳转到报告页
            }
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        startBtn.addEventListener('click', function() {
            const questions = SAMPLE_QUESTIONS;
            if (questions.length === 0) {
                alert('题库为空，请先导入题目。');
                return;
            }
            homePage.style.display = 'none';
            quizPage.classList.add('show');
            initQuiz(questions);
        });

        quizBack.addEventListener('click', function() {
            quizPage.classList.remove('show');
            homePage.style.display = 'block';
        });

        prevBtn.addEventListener('click', goToPrev);
        nextBtn.addEventListener('click', goToNext);

        reportBtn.addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线。\n完成诊断后，将自动生成你的薄弱知识点分析。');
        });

        // ============================================================
        // 触摸滑动（左右滑动翻题）
        // ============================================================
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;
        const wrap = document.getElementById('cardWrap');

        wrap.addEventListener('touchstart', function(e) {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            isSwiping = false;
        }, { passive: true });

        wrap.addEventListener('touchmove', function(e) {
            if (e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                isSwiping = true;
                e.preventDefault();
            }
        }, { passive: false });

        wrap.addEventListener('touchend', function(e) {
            if (!isSwiping) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            if (dx < -50) {
                goToNext();
            } else if (dx > 50) {
                goToPrev();
            }
        }, { passive: true });

        // ============================================================
        // 键盘支持（左右箭头）
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (!quizPage.classList.contains('show')) return;
            if (e.key === 'ArrowLeft') goToPrev();
            if (e.key === 'ArrowRight') goToNext();
        });

        // ============================================================
        // 窗口resize时重新定位卡片
        // ============================================================
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (quizPage.classList.contains('show')) {
                    const idx = state.currentIndex || 0;
                    const track = cardTrack;
                    const cardWidth = track.parentElement.clientWidth || 380;
                    track.style.transition = 'none';
                    track.style.transform = `translateX(-${idx * cardWidth}px)`;
                    requestAnimationFrame(() => {
                        track.style.transition = 'transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                    });
                }
            }, 200);
        });

        // 启动时检查
        console.log('✅ 道法历史闯关已加载（浅色毛玻璃版）');
        console.log('📚 题库共 ' + SAMPLE_QUESTIONS.length + ' 题（示例数据）');
    </script>
</body>
</html>
