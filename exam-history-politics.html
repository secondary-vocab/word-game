<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: #ffffff;
            padding: 4px 8px 6px 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
            margin-bottom: 6px;
            text-align: left;
            letter-spacing: 0.3px;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 9px;
            color: #8a7a6a;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 2px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 13px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
            font-weight: 400;
        }
        .calendar-days .day .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 500;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 品牌区（浅金色） ===== */
        .brand-section {
            border-radius: 14px;
            padding: 0;
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            height: 80px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e8e0d8;
            background: #f5f0e8 url('images/ce5808ec5b21247ef5e61931e2f57046.jpg') no-repeat center/cover;
        }
        .brand-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(55deg, transparent, transparent 18px,
                    rgba(180, 150, 120, 0.12) 18px, rgba(180, 150, 120, 0.12) 19px),
                repeating-linear-gradient(-55deg, transparent, transparent 18px,
                    rgba(180, 150, 120, 0.10) 18px, rgba(180, 150, 120, 0.10) 19px),
                repeating-linear-gradient(0deg, transparent, transparent 24px,
                    rgba(180, 150, 120, 0.08) 24px, rgba(180, 150, 120, 0.08) 25px),
                linear-gradient(135deg, rgba(180, 150, 120, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }
        .brand-top {
            flex: 1;
            padding: 12px 18px 6px 18px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            z-index: 1;
            background:#dcdcdc;
            backdrop-filter: blur(2px);
        }
        .brand-text {
            font-size: 20px;
            font-weight: 400;
            color: #2c241c;
            letter-spacing: 2px;
        }
        .brand-text .history {
            color: #b8864a;
        }
        .brand-text .politics {
            color: #4a6a8a;
        }
        .brand-sub {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 300;
            letter-spacing: 1px;
            padding-top: 2px;
        }
        .brand-bottom {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 0 18px 10px 18px;
            z-index: 1;
        }
        .brand-bottom::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(0deg, rgba(0, 0, 0, 0.02) 0px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.02) 0px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
            z-index: 0;
        }
        .brand-bottom::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(45deg, transparent, transparent 12px,
                    rgba(180, 150, 120, 0.05) 12px, rgba(180, 150, 120, 0.05) 13px);
            pointer-events: none;
            z-index: 0;
        }
        .brand-number {
            font-size: 18px;
            font-weight: 300;
            color: #8a7a6a;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.5);
            padding: 2px 14px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }
        .brand-number strong {
            font-weight: 500;
            color: #b8864a;
        }

        /* ===== 首页网格 ===== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            min-height: 0;
            overflow: hidden;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }

        .card-module.large {
            grid-row: span 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #f0ecf5;
            border-color: #e8e0d8;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 400;
            color: #b8a48a;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
            font-weight: 400;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        .card-module.small {
            padding: 8px 12px;
        }
        .card-module.small .label {
            font-size: 14px;
            font-weight: 400;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
        }

        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #b8a48a;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(184, 164, 138, 0.20);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .btn-primary:active {
            background: #a08c74;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ============================================================
           第2页（修正版）
           ============================================================ */
        .page-secondary {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            padding: 12px 16px 20px;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }
        .page-secondary.show {
            display: flex;
        }
        .page-secondary-inner {
            max-width: 420px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-secondary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 4px 0;
            flex-shrink: 0;
        }
        .page-secondary-header .back {
            font-size: 32px;
            font-weight: 700;
            color: #4a6a8a;
            cursor: pointer;
            padding: 0 8px 0 0;
            background: none;
            border: none;
            line-height: 0.8;
            letter-spacing: -4px;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            display: inline-block;
        }
        .page-secondary-header .back:active {
            opacity: 0.6;
        }
        .page-secondary-header .placeholder {
            width: 40px;
        }

        .subject-cards-row {
            display: flex;
            gap: 32px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .subject-card {
    flex: 1;
    padding: 6px 12px 4px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    background: #ffffff;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    border: none;
    position: relative;
    min-height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
        .subject-card:active {
            transform: scale(0.96);
        }
        .subject-card.active {
            box-shadow: 0 4px 20px rgba(196, 154, 108, 0.12);
        }
        .subject-card[data-subject="history"] {
            background: #faf6f0;
        }
        .subject-card[data-subject="politics"] {
            background: #f0f4f8;
        }
        .subject-card .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }
        .subject-card .name {
            font-size: 18px;
            font-weight: 600;
            color: #2c241c;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .subject-card .progress {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 400;
            text-align: right;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .subject-card .progress .num {
            font-weight: 500;
            color: #c49a6c;
        }

        .plan-title {
            font-size: 20px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 2px;
            flex-shrink: 0;
            padding-top: 2px;
            letter-spacing: 0.5px;
        }

        .module-label {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
            margin-bottom: 10px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding-top: 2px;
            min-height: 0;
        }
        .unit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-radius: 12px;
            background: #faf8f6;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            flex: 0 0 auto;
            min-height: 48px;
        }
        .unit-item:active {
            background: #f0ede8;
        }
        .unit-item .name {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }
        .unit-item .name .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .unit-item .name .dot.done {
            background: #c49a6c;
        }
        .unit-item .name .dot.active {
            background: #b8864a;
        }
        .unit-item .name .dot.pending {
            background: #dcd3cb;
        }
        .unit-item .progress {
            font-size: 12px;
            color: #8a7a6a;
            font-weight: 400;
        }
        .unit-item .progress .done {
            color: #c49a6c;
            font-weight: 500;
        }

        .unit-item.summary {
            background: #f0ece6;
            border: 1px solid #e8e0d8;
        }
        .unit-item.summary .name {
            font-weight: 500;
        }

        /* ===== 学习成果模块 ===== */
        .result-section {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid #f0ede8;
            margin-top: 8px;
            padding-bottom: 16px;
        }
        .result-title {
            font-size: 14px;
            font-weight: 500;
            color: #2c241c;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
        }
        .result-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8a7a6a;
        }
        .result-row .unit-name {
            font-size: 11px;
            color: #8a7a6a;
            flex-shrink: 0;
            min-width: 32px;
        }
        .result-row .bar-wrap {
            flex: 1;
            height: 5px;
            background: #f0ede8;
            border-radius: 4px;
            overflow: hidden;
        }
        .result-row .bar-wrap .bar {
            height: 100%;
            border-radius: 4px;
            background: #c49a6c;
            transition: width 0.3s;
        }
        .result-row .percent {
            font-size: 11px;
            color: #b8a48a;
            flex-shrink: 0;
            min-width: 28px;
            text-align: right;
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section { padding: 2px 6px 4px 6px; margin-bottom: 6px; }
            .calendar-header { font-size: 12px; margin-bottom: 4px; }
            .calendar-week { font-size: 8px; }
            .calendar-days .day { font-size: 11px; padding: 1px 0; }
            .calendar-days .day .dot { width: 2px; height: 2px; }
            .brand-section { height: 60px; margin-bottom: 8px; }
            .brand-top { padding: 6px 12px 4px 12px; }
            .brand-text { font-size: 16px; }
            .brand-sub { font-size: 10px; }
            .brand-bottom { padding: 0 12px 6px 12px; }
            .brand-number { font-size: 14px; padding: 2px 10px; }
            .card-module { padding: 4px 8px; }
            .card-module.large { padding-top: 6px; }
            .card-module.large .label { font-size: 12px; }
            .card-module.large .big-number { font-size: 16px; }
            .card-module.large .sub-line { font-size: 10px; }
            .card-module.large .weak-tag { font-size: 10px; padding: 2px 8px; }
            .card-module.small .label { font-size: 11px; }
            .btn-primary { padding: 8px 0; font-size: 13px; margin-top: 4px; }
            .btn-secondary { padding: 6px 0; font-size: 12px; }
            .grid-container { gap: 6px; }
            .page-secondary-header .back { font-size: 24px; }
            .subject-card .name { font-size: 18px; }
            .subject-card .progress { font-size: 11px; }
            .subject-card { padding: 8px 12px 6px 12px; min-height: 52px; }
            .plan-title { font-size: 16px; }
            .module-label { font-size: 11px; margin-bottom: 8px; }
            .unit-item { padding: 8px 14px; min-height: 40px; }
            .unit-item .name { font-size: 13px; }
            .unit-item .progress { font-size: 11px; }
            .unit-list { gap: 6px; }
            .subject-cards-row { gap: 20px; margin-bottom: 10px; }
            .result-section { padding-top: 12px; padding-bottom: 10px; }
            .result-title { font-size: 13px; }
            .result-row { font-size: 11px; }
            .result-row .bar-wrap { height: 4px; }
        }
        @media (max-height: 600px) {
            .calendar-days .day { font-size: 10px; }
            .brand-section { height: 50px; }
            .brand-top { padding: 4px 10px 2px 10px; }
            .brand-text { font-size: 14px; }
            .brand-sub { font-size: 9px; }
            .brand-bottom { padding: 0 10px 4px 10px; }
            .brand-number { font-size: 12px; padding: 2px 8px; }
            .card-module.large .big-number { font-size: 14px; }
            .card-module.small .label { font-size: 10px; }
            .btn-primary { padding: 6px 0; font-size: 12px; }
            .page-secondary-header .back { font-size: 20px; }
            .subject-card .name { font-size: 15px; }
            .subject-card .progress { font-size: 10px; }
            .subject-card { padding: 6px 10px 4px 10px; min-height: 44px; }
            .plan-title { font-size: 14px; }
            .module-label { font-size: 10px; margin-bottom: 6px; }
            .unit-item { padding: 6px 12px; min-height: 34px; }
            .unit-item .name { font-size: 12px; }
            .unit-list { gap: 4px; }
            .subject-cards-row { gap: 16px; margin-bottom: 8px; }
            .result-section { padding-top: 8px; padding-bottom: 6px; }
            .result-title { font-size: 12px; }
            .result-row { font-size: 10px; }
            .result-row .bar-wrap { height: 3px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <!-- ===== 首页 ===== -->
        <div id="homePage">
            <div class="calendar-section" id="calendarSection"></div>
            <div class="brand-section">
                <div class="brand-top">
                    <div class="brand-text">
                        <span class="history">历史</span> · <span class="politics">道法</span>
                    </div>
                    <div class="brand-sub">✦ 双科精炼</div>
                </div>
                <div class="brand-bottom">
                    <div class="brand-number"><strong>万题</strong> 精选题库 · 持续更新</div>
                </div>
            </div>
            <div class="grid-container" id="gridContainer"></div>
            <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
            <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>
        </div>

        <!-- ===== 第2页 ===== -->
        <div class="page-secondary" id="pageSecondary">
            <div class="page-secondary-inner">
                <div class="calendar-section" id="calendarSection2"></div>
                <div class="page-secondary-header">
                    <button class="back" id="backToHome">❮</button>
                    <span class="placeholder"></span>
                </div>
                <div class="subject-cards-row" id="subjectCardsRow">
                    <div class="subject-card active" data-subject="history">
    <div class="name"> 历史</div>
    <div class="progress">已刷 <span class="num" id="histProgress">0</span> / 0 题</div>
</div>
<div class="subject-card" data-subject="politics">
    <div class="name"> 道法</div>
    <div class="progress">已刷 <span class="num" id="poliProgress">0</span> / 0 题</div>
</div>
                </div>
                <div class="plan-title">📋 学习计划</div>
                <div class="module-label" id="moduleLabel">七上</div>
                <div class="unit-list" id="unitList2"></div>
                <div class="result-section" id="resultSection">
                    <div class="result-title">📊 学习成果</div>
                    <div class="result-grid" id="resultGrid"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. 日历
        // ============================================================
        function renderCalendar(containerId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(today - now.getDay());
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(firstDayOfWeek.getDate() + i);
                weekDates.push(d);
            }
            let usedDays = {};
            try {
                const stored = localStorage.getItem('daofa_used_days');
                if (stored) usedDays = JSON.parse(stored);
            } catch (e) {}
            const todayKey = year + '-' + (month + 1) + '-' + today;
            if (!usedDays[todayKey]) {
                usedDays[todayKey] = true;
