<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>道法历史 · 闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: #2c241c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 16px 16px;
        }
        .app {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 800px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 日历 ===== */
        .calendar-section {
            background: #ffffff;
            padding: 6px 8px 8px 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calendar-header {
            font-size: 15px;
            font-weight: 400;
            color: #2c241c;
            margin-bottom: 8px;
            text-align: left;
            letter-spacing: 0.3px;
        }
        .calendar-week {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 10px;
            color: #8a7a6a;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 4px;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }
        .calendar-days .day {
            font-size: 14px;
            color: #2c241c;
            padding: 2px 0;
            border-radius: 50%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            gap: 1px;
            font-weight: 400;
        }
        .calendar-days .day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #c49a6c;
            display: none;
        }
        .calendar-days .day .dot.used {
            display: block;
        }
        .calendar-days .day.today {
            background: #c49a6c;
            color: #fff;
            font-weight: 500;
        }
        .calendar-days .day.today .dot {
            background: #fff;
        }
        .calendar-days .day.used-date .dot {
            display: block;
        }
        .calendar-days .day.other-month {
            color: #dcd3cb;
        }

        /* ===== 品牌区（首页 - 报纸底纹） ===== */
        .brand-section {
            border-radius: 14px;
            padding: 20px 18px;
            margin-bottom: 14px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f7f4f0;
            border: 1px solid #f0ede8;
        }
        /* 报纸排版底纹 */
        .brand-section::before {
            content: 'The world is a book, and those who do not travel read only one page. Education is the most powerful weapon. History is a pact between the dead, the living, and the yet unborn. Justice is the constant and perpetual will to render to every man his due. Knowledge is power. Learning is a treasure that will follow its owner everywhere. Democracy is the government of the people. Liberty without obedience is license. The only thing necessary for the triumph of evil is for good men to do nothing.';
            position: absolute;
            top: -8px;
            left: -10px;
            right: -10px;
            bottom: -8px;
            font-family: "Times New Roman", serif;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.04);
            line-height: 1.4;
            letter-spacing: 0.5px;
            word-break: break-all;
            pointer-events: none;
            z-index: 0;
            transform: rotate(-2deg) scale(1.05);
            text-align: justify;
            padding: 8px;
        }
        .brand-section::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 50%);
            pointer-events: none;
            z-index: 0;
        }
        .brand-text {
            font-size: 22px;
            font-weight: 400;
            color: #2c241c;
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 16px 4px 12px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .brand-text .history {
            color: #b8864a;
        }
        .brand-text .politics {
            color: #4a6a8a;
        }
        .brand-sub {
            font-size: 12px;
            color: #8a7a6a;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
            font-weight: 300;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 14px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }

        /* ===== 首页网格 ===== */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(6, 1fr);
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .card-module {
            background: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.1s, box-shadow 0.15s;
            min-height: 0;
            overflow: hidden;
        }
        .card-module:active {
            transform: scale(0.96);
        }
        .card-module .label {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
        }
        .card-module .sub {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }

        .card-module.large {
            grid-row: span 3;
            justify-content: flex-start;
            padding-top: 14px;
            background: #faf8f6;
            border-color: #e8e0d8;
        }
        .card-module.large .label {
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 4px;
        }
        .card-module.large .big-number {
            font-size: 24px;
            font-weight: 400;
            color: #c49a6c;
            line-height: 1.2;
        }
        .card-module.large .big-number .small {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
        }
        .card-module.large .sub-line {
            font-size: 12px;
            color: #8a7a6a;
            margin-top: 2px;
            font-weight: 400;
        }
        .card-module.large .weak-tag {
            font-size: 12px;
            color: #8a7a6a;
            background: rgba(196, 154, 108, 0.08);
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
            font-weight: 400;
        }
        .card-module.large .weak-tag strong {
            color: #b8864a;
            font-weight: 500;
        }

        .card-module.small {
            padding: 8px 12px;
        }
        .card-module.small .label {
            font-size: 14px;
            font-weight: 400;
        }
        .card-module.small .sub {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
        }

        .card-module.color-blue {
            background: #eef4f9;
        }
        .card-module.color-pink {
            background: #f9f0ee;
        }
        .card-module.color-green {
            background: #eef5ed;
        }

        /* ===== 底部按钮 - 哑光金 ===== */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #b8a48a;
            color: #fff;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 12px rgba(184, 164, 138, 0.20);
            margin-top: 10px;
            transition: background 0.15s, transform 0.1s;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }
        .btn-primary:active {
            background: #a08c74;
            transform: scale(0.97);
        }
        .btn-secondary {
            display: block;
            width: 100%;
            padding: 10px 0;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: #8a7a6a;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            border: 1px solid rgba(138, 122, 106, 0.15);
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .btn-secondary:active {
            background: rgba(138, 122, 106, 0.04);
        }

        /* ============================================================
           第2页 - PlanBingo风格
           ============================================================ */
        .page-secondary {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            padding: 12px 16px 20px;
            flex-direction: column;
            overflow-y: auto;
            align-items: center;
        }
        .page-secondary.show {
            display: flex;
        }
        .page-secondary-inner {
            max-width: 420px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .page-secondary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0 6px 0;
            flex-shrink: 0;
        }
        .page-secondary-header .back {
            font-size: 32px;
            font-weight: 700;
            color: #4a6a8a;
            cursor: pointer;
            padding: 0 8px 0 0;
            background: none;
            border: none;
            line-height: 0.8;
            letter-spacing: -4px;
            font-family: "Times New Roman", serif;
            transform: scaleX(1.4);
            display: inline-block;
        }
        .page-secondary-header .back:active {
            opacity: 0.6;
        }
        .page-secondary-header .placeholder {
            width: 40px;
        }

        .subject-cards-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .subject-card {
            flex: 1;
            padding: 18px 18px 14px 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: none;
            position: relative;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .subject-card:active {
            transform: scale(0.96);
        }
        .subject-card.active {
            box-shadow: 0 4px 20px rgba(196, 154, 108, 0.12);
        }
        .subject-card[data-subject="history"] {
            background: #faf6f0;
        }
        .subject-card[data-subject="politics"] {
            background: #f0f4f8;
        }
        .subject-card .name {
            font-size: 26px;
            font-weight: 300;
            color: #2c241c;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .subject-card .progress {
            font-size: 13px;
            color: #8a7a6a;
            font-weight: 400;
            text-align: right;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        .subject-card .progress .num {
            font-weight: 500;
            color: #c49a6c;
        }

        .plan-title {
            font-size: 20px;
            font-weight: 300;
            color: #2c241c;
            margin-bottom: 2px;
            flex-shrink: 0;
            padding-top: 2px;
            letter-spacing: 0.5px;
        }

        .module-label {
            font-size: 13px;
            font-weight: 400;
            color: #8a7a6a;
            margin-bottom: 16px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .unit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-top: 2px;
        }
        .unit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-radius: 14px;
            background: #faf8f6;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .unit-item:active {
            background: #f0ede8;
        }
        .unit-item .name {
            font-size: 14px;
            font-weight: 400;
            color: #2c241c;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }
        .unit-item .name .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .unit-item .name .dot.done {
            background: #c49a6c;
        }
        .unit-item .name .dot.active {
            background: #b8864a;
        }
        .unit-item .name .dot.pending {
            background: #dcd3cb;
        }
        .unit-item .progress {
            font-size: 13px;
            color: #8a7a6a;
            font-weight: 400;
        }
        .unit-item .progress .done {
            color: #c49a6c;
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-height: 700px) {
            .calendar-section { padding: 4px 6px 6px 6px; margin-bottom: 8px; }
            .calendar-header { font-size: 13px; margin-bottom: 4px; }
            .calendar-week { font-size: 9px; }
            .calendar-days .day { font-size: 12px; padding: 1px 0; }
            .calendar-days .day .dot { width: 3px; height: 3px; }
            .brand-section { height: 56px; padding: 14px 14px; margin-bottom: 10px; }
            .brand-text { font-size: 18px; padding: 2px 12px; }
            .brand-sub { font-size: 10px; padding: 2px 12px; }
            .card-module { padding: 6px 8px; }
            .card-module.large { padding-top: 8px; }
            .card-module.large .label { font-size: 13px; }
            .card-module.large .big-number { font-size: 18px; }
            .card-module.large .sub-line { font-size: 10px; }
            .card-module.large .weak-tag { font-size: 10px; padding: 2px 10px; }
            .card-module.small .label { font-size: 12px; }
            .btn-primary { padding: 10px 0; font-size: 14px; margin-top: 6px; }
            .btn-secondary { padding: 8px 0; font-size: 13px; }
            .grid-container { gap: 8px; }
            .page-secondary-header .back { font-size: 28px; }
            .subject-card .name { font-size: 20px; }
            .subject-card .progress { font-size: 12px; }
            .subject-card { padding: 14px 14px 10px 14px; min-height: 64px; }
            .plan-title { font-size: 17px; }
            .module-label { font-size: 12px; margin-bottom: 12px; }
            .unit-item { padding: 10px 14px; }
            .unit-item .name { font-size: 13px; }
            .unit-item .progress { font-size: 12px; }
            .unit-list { gap: 8px; }
        }
        @media (max-height: 600px) {
            .calendar-days .day { font-size: 10px; }
            .brand-section { height: 46px; padding: 10px 12px; }
            .brand-text { font-size: 15px; padding: 2px 10px; }
            .brand-sub { font-size: 9px; padding: 2px 10px; }
            .card-module.large .big-number { font-size: 15px; }
            .card-module.small .label { font-size: 11px; }
            .btn-primary { padding: 8px 0; font-size: 13px; }
            .page-secondary-header .back { font-size: 24px; }
            .subject-card .name { font-size: 17px; }
            .subject-card .progress { font-size: 11px; }
            .subject-card { padding: 10px 12px 8px 12px; min-height: 54px; }
            .plan-title { font-size: 15px; }
            .module-label { font-size: 11px; margin-bottom: 10px; }
            .unit-item { padding: 8px 12px; }
            .unit-item .name { font-size: 12px; }
            .unit-list { gap: 6px; }
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <!-- ===== 首页 ===== -->
        <div id="homePage">
            <div class="calendar-section" id="calendarSection"></div>
            <div class="brand-section">
                <div class="brand-text">
                    <span class="history">历史</span> · <span class="politics">道法</span>
                </div>
                <div class="brand-sub">✦ 双科闯关</div>
            </div>
            <div class="grid-container" id="gridContainer"></div>
            <button class="btn-primary" id="startBtn">开始诊断 · 10分钟找到薄弱点</button>
            <button class="btn-secondary" id="reportBtn">诊断报告（即将上线）</button>
        </div>

        <!-- ===== 第2页 ===== -->
        <div class="page-secondary" id="pageSecondary">
            <div class="page-secondary-inner">
                <div class="calendar-section" id="calendarSection2"></div>
                <div class="page-secondary-header">
                    <button class="back" id="backToHome">❮</button>
                    <span class="placeholder"></span>
                </div>
                <div class="subject-cards-row" id="subjectCardsRow">
                    <div class="subject-card active" data-subject="history">
                        <div class="name">历史</div>
                        <div class="progress">已刷 <span class="num" id="histProgress">3</span> / 20 题</div>
                    </div>
                    <div class="subject-card" data-subject="politics">
                        <div class="name">道法</div>
                        <div class="progress">已刷 <span class="num" id="poliProgress">0</span> / 20 题</div>
                    </div>
                </div>
                <div class="plan-title">学习计划</div>
                <div class="module-label">七上</div>
                <div class="unit-list" id="unitList2"></div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. 日历
        // ============================================================
        function renderCalendar(containerId) {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(today - now.getDay());
            const weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstDayOfWeek);
                d.setDate(firstDayOfWeek.getDate() + i);
                weekDates.push(d);
            }
            let usedDays = {};
            try {
                const stored = localStorage.getItem('daofa_used_days');
                if (stored) usedDays = JSON.parse(stored);
            } catch (e) {}
            const todayKey = year + '-' + (month + 1) + '-' + today;
            if (!usedDays[todayKey]) {
                usedDays[todayKey] = true;
                localStorage.setItem('daofa_used_days', JSON.stringify(usedDays));
            }
            const weekAbbr = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            let html = '';
            html += '<div class="calendar-header">' + year + '.' + (month + 1) + '</div>';
            html += '<div class="calendar-week">';
            for (let i = 0; i < 7; i++) html += '<span>' + weekAbbr[i] + '</span>';
            html += '</div>';
            html += '<div class="calendar-days">';
            for (let i = 0; i < 7; i++) {
                const d = weekDates[i];
                const day = d.getDate();
                const isToday = (day === today && d.getMonth() === month && d.getFullYear() === year);
                const key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + day;
                const used = !!usedDays[key];
                let cls = 'day';
                if (isToday) cls += ' today';
                if (used) cls += ' used-date';
                html += '<div class="' + cls + '">' +
                    '<span>' + day + '</span>' +
                    '<span class="dot' + (used ? ' used' : '') + '"></span>' +
                    '</div>';
            }
            html += '</div>';
            document.getElementById(containerId).innerHTML = html;
        }
        renderCalendar('calendarSection');
        renderCalendar('calendarSection2');

        // ============================================================
        // 2. 首页数据
        // ============================================================
        var HISTORY_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 10, total: 30, status: 'done' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 10, total: 30, status: 'active' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };
        var POLITICS_STATUS = {
            '七上': { done: 0, total: 30, status: 'pending' },
            '八上': { done: 5, total: 30, status: 'active' },
            '九上': { done: 0, total: 30, status: 'pending' },
            '七下': { done: 0, total: 30, status: 'pending' },
            '八下': { done: 0, total: 30, status: 'pending' },
            '九下': { done: 0, total: 30, status: 'pending' }
        };

        var colorMap = {
            '七上': 'color-blue',
            '七下': 'color-blue',
            '八上': 'color-pink',
            '八下': 'color-pink',
            '九上': 'color-green',
            '九下': 'color-green'
        };
        var statusMap = {
            'done': { label: '已完成' },
            'active': { label: '进行中' },
            'pending': { label: '未开始' }
        };

        // ============================================================
        // 3. 首页渲染
        // ============================================================
        function renderGrid() {
            var container = document.getElementById('gridContainer');
            var data = HISTORY_STATUS;

            var totalDone = 0,
                totalAll = 0;
            for (var key in data) {
                totalDone += data[key].done || 0;
                totalAll += data[key].total || 0;
            }
            var weakModule = '八下 · 法治';

            var leftSmall = ['七下', '八下', '九下'];
            var rightSmall = ['七上', '八上', '九上'];

            function renderCard(type, name, label, extra, rowStart, rowEnd, col) {
                var cls = 'card-module';
                if (type === 'large') cls += ' large';
                else cls += ' small ' + (colorMap[name] || '');
                var content = '';
                if (type === 'large' && name === 'diagnosis') {
                    content = `
                            <div class="label">${label}</div>
                            <div class="big-number">${extra.done}<span class="small"> / ${extra.total} 题</span></div>
                            <div class="sub-line">正确率 68%</div>
                            <div class="weak-tag">📌 薄弱：<strong>${extra.weak}</strong></div>
                        `;
                } else if (type === 'large' && name === 'sprint') {
                    content = `
                            <div class="label">${label}</div>
                            <div class="big-number">${extra.done}<span class="small"> 题</span></div>
                            <div class="sub-line">综合复习 · 查漏补缺</div>
                        `;
                } else {
                    var d = extra;
                    var info = statusMap[d.status] || statusMap['pending'];
                    content = `
                            <div class="label">${name}</div>
                            <div class="sub">${d.done > 0 ? d.done + '/' + d.total + ' 题' : info.label}</div>
                        `;
                }
                return `
                        <div class="${cls}" data-module="${name}" style="grid-row: ${rowStart} / ${rowEnd}; grid-column: ${col};">
                            ${content}
                        </div>
                    `;
            }

            var html = '';

            html += renderCard('large', 'diagnosis', '📊 学情诊断', { done: totalDone, total: totalAll, weak: weakModule }, 1, 4,
            1);
            for (var i = 0; i < leftSmall.length; i++) {
                var name = leftSmall[i];
                var d = data[name] || { done: 0, total: 0, status: 'pending' };
                html += renderCard('small', name, '', d, 4 + i, 5 + i, 1);
            }

            for (var j = 0; j < rightSmall.length; j++) {
                var name2 = rightSmall[j];
                var d2 = data[name2] || { done: 0, total: 0, status: 'pending' };
                html += renderCard('small', name2, '', d2, 1 + j, 2 + j, 2);
            }
            html += renderCard('large', 'sprint', '🎯 中考冲刺', { done: totalDone }, 4, 7, 2);

            container.innerHTML = html;

            container.querySelectorAll('.card-module').forEach(function(el) {
                el.addEventListener('click', function() {
                    var m = this.dataset.module;
                    if (m === 'diagnosis') {
                        alert('📊 学情诊断详情即将上线');
                        return;
                    }
                    if (m === 'sprint') {
                        alert('🎯 中考冲刺模块即将上线');
                        return;
                    }
                    openSecondary(m);
                });
            });
        }

        // ============================================================
        // 4. 第2页：单元数据
        // ============================================================
        var UNITS_HISTORY = [
            { id: 'h1', name: '第一单元：史前时期', total: 8, done: 3 },
            { id: 'h2', name: '第二单元：夏商周时期', total: 6, done: 0 },
            { id: 'h3', name: '第三单元：秦汉时期', total: 7, done: 0 },
            { id: 'h4', name: '第四单元：三国两晋南北朝时期', total: 7, done: 0 }
        ];
        var UNITS_POLITICS = [
            { id: 'p1', name: '第一单元：少年有梦', total: 6, done: 0 },
            { id: 'p2', name: '第二单元：成长的时空', total: 6, done: 0 },
            { id: 'p3', name: '第三单元：珍爱我们的生命', total: 6, done: 0 },
            { id: 'p4', name: '第四单元：追求美好人生', total: 6, done: 0 }
        ];

        var currentModule = '七上';
        var currentSubject = 'history';

        function openSecondary(moduleName) {
            currentModule = moduleName;
            document.getElementById('pageSecondary').classList.add('show');
            currentSubject = 'history';
            updateSubjectCards();
            renderUnits();
            renderCalendar('calendarSection2');
        }

        function closeSecondary() {
            document.getElementById('pageSecondary').classList.remove('show');
        }

        function updateSubjectCards() {
            document.querySelectorAll('#subjectCardsRow .subject-card').forEach(function(card) {
                var subject = card.dataset.subject;
                if (subject === currentSubject) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
            updateProgress();
        }

        function updateProgress() {
            var histUnits = UNITS_HISTORY;
            var poliUnits = UNITS_POLITICS;
            var histDone = 0,
                histTotal = 0;
            var poliDone = 0,
                poliTotal = 0;
            histUnits.forEach(function(u) { histDone += u.done;
                histTotal += u.total; });
            poliUnits.forEach(function(u) { poliDone += u.done;
                poliTotal += u.total; });
            document.getElementById('histProgress').textContent = histDone;
            document.getElementById('poliProgress').textContent = poliDone;
        }

        function renderUnits() {
            var container = document.getElementById('unitList2');
            var units = (currentSubject === 'history') ? UNITS_HISTORY : UNITS_POLITICS;
            var html = '';
            units.forEach(function(u) {
                var status = u.done >= u.total ? 'done' : (u.done > 0 ? 'active' : 'pending');
                var dotClass = status;
                html += `
                        <div class="unit-item" data-unit="${u.id}">
                            <span class="name">
                                <span class="dot ${dotClass}"></span>
                                ${u.name}
                            </span>
                            <span class="progress"><span class="done">${u.done}</span> / ${u.total} 题</span>
                        </div>
                    `;
            });
            container.innerHTML = html;

            updateProgress();

            container.querySelectorAll('.unit-item').forEach(function(el) {
                el.addEventListener('click', function() {
                    var subjectName = currentSubject === 'history' ? '历史' : '道法';
                    alert('📚 进入 ' + currentModule + ' · ' + subjectName + ' · ' + this.querySelector('.name')
                        .textContent.trim() + ' 刷题（示例）');
                });
            });
        }

        // ============================================================
        // 5. 第2页事件
        // ============================================================
        document.getElementById('backToHome').addEventListener('click', closeSecondary);

        document.querySelectorAll('#subjectCardsRow .subject-card').forEach(function(card) {
            card.addEventListener('click', function() {
                var subject = this.dataset.subject;
                if (subject === currentSubject) return;
                currentSubject = subject;
                updateSubjectCards();
                renderUnits();
            });
        });

        // ============================================================
        // 6. 首页底部按钮
        // ============================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            alert('🚀 诊断功能即将上线，敬请期待！');
        });
        document.getElementById('reportBtn').addEventListener('click', function() {
            alert('📊 诊断报告功能即将上线，敬请期待！');
        });

        // ============================================================
        // 7. 初始化
        // ============================================================
        renderGrid();

        console.log('✅ 道法历史 · 闯关（报纸底纹版）已加载');
    </script>
</body>
</html>
